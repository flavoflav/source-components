<header class="masthead">
  <div class="masthead-row">
    <div class="wordmark">
      <h1>Component Index</h1>
      <span class="sub" id="wm-count"></span>
    </div>
    <div class="search" id="searchwrap">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.6-3.6" stroke-linecap="round"></path>
      </svg>
      <input
        id="q"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search name, prop, slot, description"
        aria-label="Search components"
      />
      <kbd>/</kbd>
      <button class="clear-x" id="clearq" aria-label="Clear search">
        &#215;
      </button>
    </div>
    <button
      class="theme-btn"
      id="theme"
      aria-label="Switch colour theme"
      title="Switch colour theme"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"
          stroke-linejoin="round"
        ></path>
      </svg>
    </button>
  </div>
  <div class="filters">
    <div class="fgroup">
      <span class="flabel">Family</span>
      <button class="chip" data-fam="Primitives" aria-pressed="false">
        primitives <span class="n" data-c="Primitives"></span>
      </button>
      <button class="chip" data-fam="Chrome" aria-pressed="false">
        chrome <span class="n" data-c="Chrome"></span>
      </button>
      <button class="chip" data-fam="Sections" aria-pressed="false">
        sections <span class="n" data-c="Sections"></span>
      </button>
      <button class="chip" data-fam="Content" aria-pressed="false">
        content <span class="n" data-c="Content"></span>
      </button>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <div class="fgroup">
      <span class="flabel">Has</span>
      <button class="chip" data-flag="slots" aria-pressed="false">
        slots <span class="n" data-f="slots"></span>
      </button>
      <button class="chip" data-flag="image" aria-pressed="false">
        image prop <span class="n" data-f="image"></span>
      </button>
      <button class="chip" data-flag="richtext" aria-pressed="false">
        rich text <span class="n" data-f="richtext"></span>
      </button>
      <button class="chip" data-flag="state" aria-pressed="false">
        interactive <span class="n" data-f="state"></span>
      </button>
      <button class="chip" data-flag="data" aria-pressed="false">
        fetches data <span class="n" data-f="data"></span>
      </button>
    </div>
    <button class="reset" id="reset" hidden>Clear filters</button>
  </div>
</header>

<main class="shell">
  <nav class="rail" id="rail" aria-label="Component list">
    <div class="rail-head">
      <span id="rail-count"></span><span id="rail-sub"></span>
    </div>
    <div id="results"></div>
  </nav>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>

<div class="toast" id="toast" role="status"></div>
