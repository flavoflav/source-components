<title>Component Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  :root {
    --ground: #eef1f0;
    --surface: #ffffff;
    --surface-2: #f6f8f7;
    --ink: #0f1618;
    --ink-2: #38474a;
    --muted: #66757a;
    --line: #d4dcda;
    --line-2: #e3e9e7;
    --accent: #00706b;
    --accent-ink: #ffffff;
    --accent-soft: #d6e9e6;
    --accent-line: #9cc9c4;
    --req: #9a5b00;
    --req-soft: #f6e6cf;
    --code-key: #00605c;
    --code-str: #8a4a1f;
    --code-kw: #6b3fa0;
    --code-com: #7d8a8e;
    --code-num: #1f5fa8;
    --code-tag: #a03a5c;
    --shadow:
      0 1px 2px rgba(15, 22, 24, 0.06), 0 8px 24px -16px rgba(15, 22, 24, 0.3);
    --mono:
      'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans:
      'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
      sans-serif;
    --display: 'Archivo', 'IBM Plex Sans', -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: #0b1012;
      --surface: #131a1c;
      --surface-2: #182022;
      --ink: #e8eeec;
      --ink-2: #b8c6c6;
      --muted: #869697;
      --line: #253032;
      --line-2: #1d2628;
      --accent: #4ed6c8;
      --accent-ink: #06211f;
      --accent-soft: #10312f;
      --accent-line: #235a55;
      --req: #e0a75d;
      --req-soft: #33260f;
      --code-key: #63cfc4;
      --code-str: #d9a26a;
      --code-kw: #b795e8;
      --code-com: #6c7b7e;
      --code-num: #7fb2e8;
      --code-tag: #e88aa6;
      --shadow:
        0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 28px -18px rgba(0, 0, 0, 0.9);
    }
  }
  :root[data-theme='dark'] {
    --ground: #0b1012;
    --surface: #131a1c;
    --surface-2: #182022;
    --ink: #e8eeec;
    --ink-2: #b8c6c6;
    --muted: #869697;
    --line: #253032;
    --line-2: #1d2628;
    --accent: #4ed6c8;
    --accent-ink: #06211f;
    --accent-soft: #10312f;
    --accent-line: #235a55;
    --req: #e0a75d;
    --req-soft: #33260f;
    --code-key: #63cfc4;
    --code-str: #d9a26a;
    --code-kw: #b795e8;
    --code-com: #6c7b7e;
    --code-num: #7fb2e8;
    --code-tag: #e88aa6;
    --shadow:
      0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 28px -18px rgba(0, 0, 0, 0.9);
  }

  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    /* Console layout: the page itself never scrolls; each pane does. */
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  a {
    color: inherit;
  }
  button,
  input,
  select {
    font: inherit;
    color: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 1px;
  }

  /* ---------- masthead ---------- */
  .masthead {
    flex: none;
    z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .masthead-row {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 20px;
    max-width: 1680px;
    margin: 0 auto;
    flex-wrap: wrap;
  }
  .wordmark {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-right: auto;
  }
  .wordmark h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .wordmark .sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .search {
    position: relative;
    flex: 1 1 260px;
    max-width: 420px;
    min-width: 200px;
  }
  .search input {
    width: 100%;
    padding: 8px 66px 8px 32px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 2px;
    font-size: 14px;
  }
  .search input::placeholder {
    color: var(--muted);
  }
  .search svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }
  .search kbd {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 5px;
    background: var(--surface);
  }
  .search .clear-x {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: 0;
    cursor: pointer;
    color: var(--muted);
    padding: 2px 4px;
    line-height: 1;
    display: none;
  }
  .search.has-value .clear-x {
    display: block;
  }
  .search.has-value kbd {
    display: none;
  }
  .theme-btn {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 9px;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--ink-2);
  }
  .theme-btn:hover {
    border-color: var(--accent-line);
    color: var(--accent);
  }

  /* ---------- filters ---------- */
  .filters {
    display: flex;
    align-items: center;
    gap: 8px 10px;
    flex-wrap: wrap;
    padding: 0 20px 13px;
    max-width: 1680px;
    margin: 0 auto;
  }
  .fgroup {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .flabel {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 2px;
  }
  .chip {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: var(--surface-2);
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip:hover {
    border-color: var(--accent-line);
    color: var(--accent);
  }
  .chip[aria-pressed='true'] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .chip .n {
    opacity: 0.6;
    font-size: 10.5px;
  }
  .chip[aria-pressed='true'] .n {
    opacity: 0.8;
  }
  .divider {
    width: 1px;
    height: 20px;
    background: var(--line);
    margin: 0 4px;
  }
  .reset {
    font-family: var(--mono);
    font-size: 11px;
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px 2px;
  }
  .reset:hover {
    color: var(--accent);
  }

  /* ---------- shell ---------- */
  .shell {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1680px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(280px, 340px) 1fr;
    gap: 0;
  }
  .rail {
    border-right: 1px solid var(--line);
    min-height: 0;
    overflow-y: auto;
    background: var(--surface);
    overscroll-behavior: contain;
  }
  .rail-head {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--surface);
    border-bottom: 1px solid var(--line-2);
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .group-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 16px 6px;
    border-bottom: 1px solid var(--line-2);
    background: var(--surface-2);
  }
  .rail ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .rail li {
    border-bottom: 1px solid var(--line-2);
  }
  .entry {
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    cursor: pointer;
    padding: 9px 16px;
    display: grid;
    gap: 2px;
    border-left: 2px solid transparent;
  }
  .entry:hover {
    background: var(--surface-2);
  }
  .entry[aria-current='true'] {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  .entry .en {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
  }
  .entry[aria-current='true'] .en {
    color: var(--accent);
  }
  .entry .em {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .dotrow {
    display: inline-flex;
    gap: 4px;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.75;
  }
  .empty {
    padding: 40px 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .empty b {
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 500;
  }

  /* ---------- detail ---------- */
  .detail {
    padding: 26px 30px 80px;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .back {
    display: none;
    background: none;
    border: 0;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    padding: 0 0 14px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .dhead {
    display: grid;
    gap: 10px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .dtitle {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .dtitle h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(24px, 3vw, 32px);
    letter-spacing: -0.025em;
    margin: 0;
    text-wrap: balance;
  }
  .machine {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    padding: 2px 8px;
    border-radius: 2px;
  }
  .fam {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 2px 7px;
    border-radius: 2px;
  }
  .desc {
    color: var(--ink-2);
    max-width: 68ch;
    font-size: 15.5px;
  }

  .facts {
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    border: 1px solid var(--line);
    border-radius: 2px;
    margin: 20px 0 26px;
    background: var(--surface);
    overflow: hidden;
  }
  .fact {
    flex: 1 1 110px;
    padding: 11px 14px;
    border-right: 1px solid var(--line-2);
  }
  .fact:last-child {
    border-right: 0;
  }
  .fact dt {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 3px;
  }
  .fact dd {
    margin: 0;
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .fact dd.none {
    color: var(--muted);
    font-size: 14px;
  }

  .sect {
    margin: 30px 0;
  }
  .sect > h3 {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .sect > h3 .hint {
    text-transform: none;
    letter-spacing: 0;
    font-size: 11px;
  }

  .tablewrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: var(--surface);
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 620px;
    font-size: 13.5px;
  }
  th {
    text-align: left;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
    white-space: nowrap;
  }
  td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--line-2);
    vertical-align: top;
  }
  tr:last-child td {
    border-bottom: 0;
  }
  td.pname {
    font-family: var(--mono);
    font-weight: 500;
    white-space: nowrap;
  }
  .kind {
    font-family: var(--mono);
    font-size: 11px;
    padding: 1px 7px;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink-2);
    background: var(--surface-2);
    white-space: nowrap;
  }
  .kind[data-k='image'],
  .kind[data-k='object'] {
    border-color: var(--accent-line);
    color: var(--accent);
  }
  .req {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--req);
    background: var(--req-soft);
    border: 1px solid currentColor;
    padding: 0 5px;
    border-radius: 2px;
  }
  .enums {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 5px;
  }
  .enums span {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    border: 1px dashed var(--line);
    padding: 0 5px;
    border-radius: 2px;
  }
  .ex {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    word-break: break-word;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .pill {
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid var(--accent-line);
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 2px;
  }
  .pill.plain {
    border-color: var(--line);
    color: var(--ink-2);
    background: var(--surface-2);
  }
  .noslots {
    color: var(--muted);
    font-size: 13.5px;
    font-style: italic;
  }

  /* ---------- code ---------- */
  .codebox {
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    background: var(--surface);
  }
  .codebar {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    padding: 0 6px 0 0;
  }
  .ctab {
    font-family: var(--mono);
    font-size: 12px;
    padding: 9px 13px;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .ctab:hover {
    color: var(--ink);
  }
  .ctab[aria-selected='true'] {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--surface);
  }
  .copy {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 4px 9px;
    cursor: pointer;
    color: var(--ink-2);
  }
  .copy:hover {
    border-color: var(--accent-line);
    color: var(--accent);
  }
  .copy[data-done='1'] {
    color: var(--accent);
    border-color: var(--accent-line);
  }
  pre.code {
    margin: 0;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.7;
    tab-size: 2;
    padding: 10px 0;
    background: var(--surface);
  }
  pre.code .ln {
    display: block;
    padding: 0 16px 0 0;
    white-space: pre;
  }
  pre.code .ln::before {
    content: attr(data-n);
    display: inline-block;
    width: 3.2em;
    padding-right: 1.2em;
    text-align: right;
    color: var(--muted);
    opacity: 0.5;
    user-select: none;
    font-variant-numeric: tabular-nums;
    position: sticky;
    left: 0;
    background: var(--surface);
  }
  .tk-com {
    color: var(--code-com);
    font-style: italic;
  }
  .tk-str {
    color: var(--code-str);
  }
  .tk-kw {
    color: var(--code-kw);
    font-weight: 500;
  }
  .tk-num {
    color: var(--code-num);
  }
  .tk-tag {
    color: var(--code-tag);
  }
  .tk-key {
    color: var(--code-key);
    font-weight: 500;
  }

  .usedon {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .usedon a {
    font-family: var(--mono);
    font-size: 11.5px;
    text-decoration: none;
    border: 1px solid var(--line);
    background: var(--surface-2);
    padding: 3px 8px;
    border-radius: 2px;
    color: var(--ink-2);
  }
  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: var(--ink);
    color: var(--ground);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transition:
      opacity 0.18s,
      transform 0.18s;
    z-index: 60;
    box-shadow: var(--shadow);
  }
  .toast.on {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 760px) {
    /* the rule between filter groups only reads as a rule when they sit on one line */
    .divider {
      display: none;
    }
    .filters {
      gap: 6px 8px;
    }
  }
  @media (max-width: 900px) {
    body {
      height: auto;
      overflow: visible;
      display: block;
    }
    .masthead {
      position: sticky;
      top: 0;
    }
    .shell {
      grid-template-columns: 1fr;
      display: block;
    }
    .rail {
      overflow: visible;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .detail {
      overflow: visible;
      padding: 20px 18px 60px;
    }
    body[data-view='detail'] .rail {
      display: none;
    }
    body[data-view='detail'] .back {
      display: block;
    }
    body[data-view='list'] .detail {
      display: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
      animation: none !important;
    }
  }
</style>

<header class="masthead">
  <div class="masthead-row">
    <div class="wordmark">
      <h1>Component Index</h1>
      <span class="sub" id="wm-count"></span>
    </div>
    <div class="search" id="searchwrap">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.6-3.6" stroke-linecap="round"></path>
      </svg>
      <input
        id="q"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search name, prop, slot, description"
        aria-label="Search components"
      />
      <kbd>/</kbd>
      <button class="clear-x" id="clearq" aria-label="Clear search">
        &#215;

        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Blog post\",\n      \"props\": {\n        \"title\": \"What changed in the 2026 platform release\",\n        \"standfirst\": \"The short opening paragraph that sits under the headline.\",\n        \"body\": \"\u003cp>The opening paragraph of the article sets up the problem.\u003c/p>\u003ch2>A section heading\u003c/h2>\u003cp>More body copy with a \u003ca href=\\\"/docs\\\">link\u003c/a> and a list:\u003c/p>\u003cul>\u003cli>First change\u003c/li>\u003cli>Second change\u003c/li>\u003c/ul>\u003cblockquote>A pulled-out line worth emphasising.\u003c/blockquote>\",\n        \"heroImage\": {\n          \"src\": \"https://placehold.co/1600x900@2x.png\",\n          \"alt\": \"\",\n          \"width\": 1600,\n          \"height\": 900\n        },\n        \"category\": \"Product\",\n        \"date\": \"12 March 2026\",\n        \"authorName\": \"Jamie Lee\",\n        \"authorTitle\": \"Principal Engineer\",\n        \"readingTime\": \"5 min read\"\n      },\n      \"slots\": { \"footer\": [\"cta\"] },\n      \"elements\": {\n        \"cta\": {\n          \"type\": \"cta-banner\",\n          \"props\": {\n            \"title\": \"Want a walkthrough?\",\n            \"background\": \"light\",\n            \"layout\": \"inline\"\n          }\n        }\n      }\n    }\n  ]\n}\n"

up-hover:no-underline\">\n          {linkLabel}\n        \u003c/span>\n      )}\n    \u003c/div>\n  \u003c/CardShell>\n);\n\nexport default Card;\n",
        "yml": "name: Card\nmachineName: card\ndescription: >-\n  General purpose content card - optional image, eyebrow, title, body and either\n  a link label or composed action buttons. This is the default card for grids;\n  use Article Card, Story Card, Resource Card, Person Card or Stat Card only\n  when their extra metadata is genuinely needed.\nstatus: true\nrequired:\n  - title\nprops:\n  properties:\n    image:\n      title: Image\n      type: object\n      examples:\n        - src: https://placehold.co/900x600@2x.png\n          alt: ''\n          width: 900\n          height: 600\n      $ref: json-schema-definitions://canvas.module/image\n    eyebrow:\n      title: Eyebrow\n      type: string\n      examples:\n        - Capability\n    title:\n      title: Title\n      type: string\n      examples:\n        - A clear card title\n    body:\n      title: Body\n      type: string\n      contentMediaType: text/html\n      x-formatting-context: block\n      examples:\n        - \u003cp>Two lines of supporting copy that explain the card.\u003c/p>\n    url:\n      title: Url\n      type: string\n      format: uri-reference\n      examples:\n        - /learn-more\n    linkLabel:\n      title: Link Label\n      type: string\n      examples:\n        - Learn more\n    variant:\n      title: Variant\n      type: string\n      enum:\n        - plain\n        - bordered\n        - elevated\n        - filled\n        - dark\n      meta:enum:\n        plain: Plain\n        bordered: Bordered\n        elevated: Elevated\n        filled: Filled\n        dark: Dark\n      examples:\n        - bordered\n    horizontal:\n      title: Horizontal\n      type: boolean\n      examples:\n        - false\nslots:\n  actions:\n    title: Actions\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"With image\",\n      \"props\": {\n        \"image\": {\n          \"src\": \"https://placehold.co/900x600@2x.png\",\n          \"alt\": \"\",\n          \"width\": 900,\n          \"height\": 600\n        },\n        \"eyebrow\": \"Capability\",\n        \"title\": \"A clear card title\",\n        \"body\": \"\u003cp>Two lines of supporting copy that explain the card.\u003c/p>\",\n        \"url\": \"/learn-more\",\n        \"linkLabel\": \"Learn more\",\n        \"variant\": \"bordered\"\n      }\n    },\n    {\n      \"name\": \"Horizontal elevated\",\n      \"props\": {\n        \"image\": {\n          \"src\": \"https://placehold.co/900x600@2x.png\",\n          \"alt\": \"\",\n          \"width\": 900,\n          \"height\": 600\n        },\n        \"title\": \"Horizontal card\",\n        \"body\": \"\u003cp>Media on the left, copy on the right.\u003c/p>\",\n        \"variant\": \"elevated\",\n        \"horizontal\": true\n      }\n    },\n    {\n      \"name\": \"Dark, no image\",\n      \"props\": {\n        \"title\": \"Dark card\",\n        \"body\": \"\u003cp>Useful on dark section bands.\u003c/p>\",\n        \"variant\": \"dark\"\n      }\n    }\n  ]\n}\n"

        "jsx": "import { Children, useState } from 'react';\nimport { cn, FormattedText } from 'drupal-canvas';\n\nconst backgrounds = {\n  none: '',\n  white: 'bg-white text-gray-900',\n  light: 'bg-gray-50 text-gray-900',\n  dark: 'bg-gray-900 text-white',\n  primary: 'bg-primary-700 text-white',\n};\n\nconst perView = {\n  1: 'basis-full',\n  2: 'basis-full sm:basis-1/2',\n  3: 'basis-full sm:basis-1/2 lg:basis-1/3',\n};\n\nconst Carousel = ({\n  title,\n  intro,\n  slidesPerView = 1,\n  background = 'none',\n  showArrows = true,\n  slides,\n  className,\n}) => {\n  const [index, setIndex] = useState(0);\n  const count = Children.count(slides);\n  const step = 100 / slidesPerView;\n  const maxIndex = Math.max(0, count - slidesPerView);\n\n  return (\n    \u003csection className={cn('w-full py-16', backgrounds[background], className)}>\n      \u003cdiv className=\"mx-auto max-w-7xl px-6\">\n        {(title || intro) && (\n          \u003cdiv className=\"mb-10 flex flex-col gap-3\">\n            {title && (\n              \u003ch2 className=\"text-3xl font-semibold tracking-tight md:text-4xl\">\n                {title}\n              \u003c/h2>\n            )}\n            {intro && (\n              \u003cFormattedText className=\"max-w-2xl text-lg leading-relaxed opacity-80\">\n                {intro}\n              \u003c/FormattedText>\n            )}\n          \u003c/div>\n        )}\n\n        \u003cdiv className=\"overflow-hidden\">\n          \u003cdiv\n            className=\"flex transition-transform duration-500 ease-out\"\n            style={{ transform: `translateX(-${index * step}%)` }}\n          >\n            {Children.map(slides, (slide, i) => (\n              \u003cdiv\n                key={i}\n                className={cn('w-full shrink-0 px-3', perView[slidesPerView])}\n              >\n                {slide}\n              \u003c/div>\n            ))}\n          \u003c/div>\n        \u003c/div>\n\n        {showArrows && count > slidesPerView && (\n          \u003cdiv className=\"mt-8 flex items-center justify-center gap-3\">\n            \u003cbutton\n              type=\"button\"\n              aria-label=\"Previous slide\"\n              onClick={() => setIndex((v) => Math.max(0, v - 1))}\n              disabled={index === 0}\n              className=\"inline-flex h-10 w-10 items-center justify-center rounded-full border border-current/30 disabled:opacity-30\"\n            >\n              \u003csvg\n                viewBox=\"0 0 24 24\"\n                aria-hidden=\"true\"\n                className=\"h-4 w-4\"\n                fill=\"none\"\n                stroke=\"currentColor\"\n                strokeWidth=\"2\"\n              >\n                \u003cpath d=\"M15 5l-7 7 7 7\" strokeLinecap=\"round\" />\n              \u003c/svg>\n            \u003c/button>\n            \u003cp className=\"text-sm tabular-nums opacity-70\">\n              {index + 1} / {maxIndex + 1}\n            \u003c/p>\n            \u003cbutton\n              type=\"button\"\n              aria-label=\"Next slide\"\n              onClick={() => setIndex((v) => Math.min(maxIndex, v + 1))}\n              disabled={index >= maxIndex}\n              className=\"inline-flex h-10 w-10 items-center justify-center rounded-full border border-current/30 disabled:opacity-30\"\n            >\n              \u003csvg\n                viewBox=\"0 0 24 24\"\n                aria-hidden=\"true\"\n                className=\"h-4 w-4\"\n                fill=\"none\"\n                stroke=\"currentColor\"\n                strokeWidth=\"2\"\n              >\n                \u003cpath d=\"M9 5l7 7-7 7\" strokeLinecap=\"round\" />\n              \u003c/svg>\n            \u003c/button>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/section>\n  );\n};\n\nexport default Carousel;\n",
        "yml": "name: Carousel\nmachineName: carousel\ndescription: >-\n  Horizontally sliding band that shows one to three items at a time with\n  previous and next controls. Put any card components in the slides slot - this\n  single component covers the testimonial carousel, story carousel, product\n  carousel and hero slider patterns.\nstatus: true\nrequired: []\nprops:\n  properties:\n    title:\n      title: Title\n      type: string\n      examples:\n        - What our customers say\n    intro:\n      title: Intro\n      type: string\n      contentMediaType: text/html\n      x-formatting-context: block\n      examples:\n        - \u003cp>Results from teams already running on the platform.\u003c/p>\n    slidesPerView:\n      title: Slides Per View\n      type: integer\n      enum:\n        - 1\n        - 2\n        - 3\n      meta:enum:\n        1: One\n        2: Two\n        3: Three\n      examples:\n        - 1\n    background:\n      title: Background\n      type: string\n      enum:\n        - none\n        - white\n        - light\n        - dark\n        - primary\n      meta:enum:\n        none: None (inherit)\n        white: White\n        light: Light gray\n        dark: Dark\n        primary: Primary\n      examples:\n        - light\n    showArrows:\n      title: Show Arrows\n      type: boolean\n      examples:\n        - true\nslots:\n  slides:\n    title: Slides\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Testimonials\",\n      \"props\": {\n        \"title\": \"What our customers say\",\n        \"slidesPerView\": 1,\n        \"background\": \"light\",\n        \"showArrows\": true\n      },\n      \"slots\": { \"slides\": [\"a\", \"b\"] },\n      \"elements\": {\n        \"a\": {\n          \"type\": \"testimonial-card\",\n          \"props\": {\n            \"quote\": \"\u003cp>We shipped our first campaign page in a day instead of a sprint.\u003c/p>\",\n            \"authorName\": \"Priya Raman\",\n            \"authorTitle\": \"Director of Digital, Northwind\",\n            \"variant\": \"plain\",\n            \"size\": \"large\"\n          }\n        },\n        \"b\": {\n          \"type\": \"testimonial-card\",\n          \"props\": {\n            \"quote\": \"\u003cp>The governance model is what convinced our security team.\u003c/p>\",\n            \"authorName\": \"Sam Okafor\",\n            \"authorTitle\": \"CISO, Meridian\",\n            \"variant\": \"plain\",\n            \"size\": \"large\"\n          }\n        }\n      }\n    },\n    {\n      \"name\": \"Three products\",\n      \"props\": { \"title\": \"Featured products\", \"slidesPerView\": 3 },\n      \"slots\": { \"slides\": [\"p1\", \"p2\", \"p3\", \"p4\"] },\n      \"elements\": {\n        \"p1\": {\n          \"type\": \"product-card\",\n          \"props\": {\n            \"name\": \"Starter kit\",\n            \"price\": \"$49\",\n            \"image\": {\n              \"src\": \"https://placehold.co/600x600@2x.png\",\n              \"alt\": \"\",\n              \"width\": 600,\n              \"height\": 600\n            }\n          }\n        },\n        \"p2\": {\n          \"type\": \"product-card\",\n          \"props\": {\n            \"name\": \"Pro bundle\",\n            \"price\": \"$99\",\n            \"image\": {\n              \"src\": \"https://placehold.co/600x600@2x.png\",\n              \"alt\": \"\",\n              \"width\": 600,\n              \"height\": 600\n            }\n          }\n        },\n        \"p3\": {\n          \"type\": \"product-card\",\n          \"props\": {\n            \"name\": \"Team pack\",\n            \"price\": \"$199\",\n            \"image\": {\n              \"src\": \"https://placehold.co/600x600@2x.png\",\n              \"alt\": \"\",\n              \"width\": 600,\n              \"height\": 600\n            }\n          }\n        },\n        \"p4\": {\n          \"type\": \"product-card\",\n          \"props\": {\n            \"name\": \"Enterprise\",\n            \"price\": \"$499\",\n            \"image\": {\n              \"src\": \"https://placehold.co/600x600@2x.png\",\n              \"alt\": \"\",\n              \"width\": 600,\n              \"height\": 600\n            }\n          }\n        }\n      }\n    }\n  ]\n}\n"

        "jsx": "import { cn, FormattedText } from 'drupal-canvas';\n\nconst backgrounds = {\n  none: '',\n  white: 'bg-white text-gray-900',\n  light: 'bg-gray-50 text-gray-900',\n  dark: 'bg-gray-900 text-white',\n};\n\nconst field =\n  'w-full rounded-md border border-gray-300 bg-white px-4 py-3 text-gray-900 focus:border-primary-500 focus:outline-2 focus:outline-offset-2 focus:outline-primary-500';\n\nconst Field = ({ id, label, type = 'text', required, half }) => (\n  \u003cdiv\n    className={cn(\n      'flex flex-col gap-2',\n      half ? 'sm:col-span-1' : 'sm:col-span-2',\n    )}\n  >\n    \u003clabel htmlFor={id} className=\"text-sm font-semibold\">\n      {label}\n      {required && \u003cspan aria-hidden=\"true\"> *\u003c/span>}\n    \u003c/label>\n    \u003cinput\n      id={id}\n      name={id}\n      type={type}\n      required={required}\n      className={field}\n    />\n  \u003c/div>\n);\n\nconst ContactForm = ({\n  title,\n  intro,\n  action,\n  submitLabel = 'Send message',\n  showCompany = true,\n  showPhone = false,\n  messageLabel = 'How can we help?',\n  consentText,\n  background = 'none',\n  aside,\n  className,\n}) => (\n  \u003csection className={cn('w-full py-16', backgrounds[background], className)}>\n    \u003cdiv\n      className={cn(\n        'mx-auto grid max-w-7xl grid-cols-1 gap-12 px-6',\n        aside && 'lg:grid-cols-2 lg:gap-20',\n      )}\n    >\n      \u003cdiv className=\"flex flex-col gap-6\">\n        {(title || intro) && (\n          \u003cdiv className=\"flex flex-col gap-3\">\n            {title && (\n              \u003ch2 className=\"text-3xl font-semibold tracking-tight md:text-4xl\">\n                {title}\n              \u003c/h2>\n            )}\n            {intro && (\n              \u003cFormattedText className=\"text-lg leading-relaxed opacity-80\">\n                {intro}\n              \u003c/FormattedText>\n            )}\n          \u003c/div>\n        )}\n\n        \u003cform\n          action={action || '/contact'}\n          method=\"post\"\n          className=\"grid grid-cols-1 gap-5 sm:grid-cols-2\"\n        >\n          \u003cField id=\"firstName\" label=\"First name\" required half />\n          \u003cField id=\"lastName\" label=\"Last name\" required half />\n          \u003cField id=\"email\" label=\"Work email\" type=\"email\" required half />\n          {showPhone && \u003cField id=\"phone\" label=\"Phone\" type=\"tel\" half />}\n          {showCompany && \u003cField id=\"company\" label=\"Company\" half />}\n\n          \u003cdiv className=\"flex flex-col gap-2 sm:col-span-2\">\n            \u003clabel htmlFor=\"message\" className=\"text-sm font-semibold\">\n              {messageLabel}\n            \u003c/label>\n            \u003ctextarea id=\"message\" name=\"message\" rows={5} className={field} />\n          \u003c/div>\n\n          {consentText && (\n            \u003cp className=\"text-xs leading-relaxed opacity-70 sm:col-span-2\">\n              {consentText}\n            \u003c/p>\n          )}\n\n          \u003cdiv className=\"sm:col-span-2\">\n            \u003cbutton\n              type=\"submit\"\n              className=\"rounded-md bg-primary-600 px-8 py-3 font-semibold text-white hover:bg-primary-700\"\n            >\n              {submitLabel}\n            \u003c/button>\n          \u003c/div>\n        \u003c/form>\n      \u003c/div>\n\n      {aside && \u003cdiv className=\"flex flex-col gap-6\">{aside}\u003c/div>}\n    \u003c/div>\n  \u003c/section>\n);\n\nexport default ContactForm;\n",
        "yml": "name: Contact Form\nmachineName: contact-form\ndescription: >-\n  Standard enquiry form - name, work email, optional company and phone, plus a\n  message box - with an aside slot for office details, a map or trust logos.\n  Wire the Action prop to a Canvas form endpoint or your marketing automation\n  handler. For email-only capture use Newsletter Signup.\nstatus: true\nrequired:\n  - title\nprops:\n  properties:\n    title:\n      title: Title\n      type: string\n      examples:\n        - Talk to our team\n    intro:\n      title: Intro\n      type: string\n      contentMediaType: text/html\n      x-formatting-context: block\n      examples:\n        - \u003cp>Tell us what you are working on and we will get back within one\n          business day.\u003c/p>\n    action:\n      title: Action\n      type: string\n      format: uri-reference\n      examples:\n        - /contact/submit\n    submitLabel:\n      title: Submit Label\n      type: string\n      examples:\n        - Send message\n    messageLabel:\n      title: Message Label\n      type: string\n      examples:\n        - How can we help?\n    showCompany:\n      title: Show Company\n      type: boolean\n      examples:\n        - true\n    showPhone:\n      title: Show Phone\n      type: boolean\n      examples:\n        - false\n    consentText:\n      title: Consent Text\n      type: string\n      examples:\n        - We use your details only to respond to this enquiry.\n    background:\n      title: Background\n      type: string\n      enum:\n        - none\n        - white\n        - light\n        - dark\n      meta:enum:\n        none: None (inherit)\n        white: White\n        light: Light gray\n        dark: Dark\n      examples:\n        - none\nslots:\n  aside:\n    title: Aside\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"With aside\",\n      \"props\": {\n        \"title\": \"Talk to our team\",\n        \"intro\": \"\u003cp>Tell us what you are working on and we will get back within one business day.\u003c/p>\",\n        \"action\": \"/contact/submit\",\n        \"showCompany\": true,\n        \"showPhone\": true,\n        \"consentText\": \"We use your details only to respond to this enquiry.\",\n        \"background\": \"light\"\n      },\n      \"slots\": { \"aside\": [\"loc\"] },\n      \"elements\": {\n        \"loc\": {\n          \"type\": \"location-card\",\n          \"props\": {\n            \"name\": \"London\",\n            \"addressLines\": \"1 Example Street\\nLondon EC1A 1AA\",\n            \"phone\": \"+44 20 7946 0000\",\n            \"email\": \"hello@example.com\"\n          }\n        }\n      }\n    },\n    {\n      \"name\": \"Form only\",\n      \"props\": { \"title\": \"Get in touch\", \"showCompany\": false }\n    }\n  ]\n}\n"

             \u003cFormattedText className=\"text-lg leading-relaxed opacity-85 [&_p]:mb-3 [&_p:last-child]:mb-0\">\n                {body}\n              \u003c/FormattedText>\n            )}\n          \u003c/div>\n          {actions && (\n            \u003cdiv\n              className={cn(\n                'relative flex flex-wrap gap-4',\n                layout === 'centered' ? 'justify-center' : 'shrink-0',\n              )}\n            >\n              {actions}\n            \u003c/div>\n          )}\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  );\n};\n\nexport default CtaBanner;\n",

        "jsx": "import { cn, FormattedText } from 'drupal-canvas';\n\nconst tones = {\n  light: 'bg-gray-50 text-gray-900',\n  dark: 'bg-gray-900 text-white',\n  primary: 'bg-primary-700 text-white',\n  outline: 'border border-gray-200 bg-white text-gray-900',\n};\n\nconst CtaTile = ({\n  icon,\n  title,\n  body,\n  linkLabel,\n  url,\n  tone = 'light',\n  backgroundImage,\n  className,\n}) => {\n  const hasImage = Boolean(backgroundImage?.src);\n\n  return (\n    \u003ca\n      href={url || '/'}\n      className={cn(\n        'group relative flex h-full flex-col gap-3 overflow-hidden rounded-xl p-8 transition-shadow hover:shadow-lg',\n        hasImage ? 'bg-gray-900 text-white' : tones[tone],\n        className,\n      )}\n    >\n      {hasImage && (\n        \u003c>\n          \u003cimg\n            src={backgroundImage.src}\n            alt={backgroundImage.alt || ''}\n            className=\"absolute inset-0 h-full w-full object-cover\"\n          />\n          \u003cdiv className=\"absolute inset-0 bg-gray-900/65 transition-colors group-hover:bg-gray-900/75\" />\n        \u003c/>\n      )}\n      \u003cdiv className=\"relative flex h-full flex-col gap-3\">\n        {icon?.src && (\n          \u003cimg\n            src={icon.src}\n            alt={icon.alt || ''}\n            width={icon.width}\n            height={icon.height}\n            className=\"mb-1 h-10 w-10 object-contain\"\n          />\n        )}\n        {title && \u003ch3 className=\"text-xl font-semibold\">{title}\u003c/h3>}\n        {body && (\n          \u003cFormattedText className=\"text-sm leading-relaxed opacity-80\">\n            {body}\n          \u003c/FormattedText>\n        )}\n        {linkLabel && (\n          \u003cspan className=\"mt-auto flex items-center gap-2 pt-4 text-sm font-semibold\">\n            {linkLabel}\n            \u003csvg\n              viewBox=\"0 0 24 24\"\n              aria-hidden=\"true\"\n              className=\"h-4 w-4 transition-transform group-hover:translate-x-1\"\n              fill=\"none\"\n              stroke=\"currentColor\"\n              strokeWidth=\"2\"\n            >\n              \u003cpath\n                d=\"M5 12h14M13 6l6 6-6 6\"\n                strokeLinecap=\"round\"\n                strokeLinejoin=\"round\"\n              />\n            \u003c/svg>\n          \u003c/span>\n        )}\n      \u003c/div>\n    \u003c/a>\n  );\n};\n\nexport default CtaTile;\n",

      "src": {
        "jsx": "import { cn, FormattedText } from 'drupal-canvas';\n\nconst DataTable = ({\n  title,\n  intro,\n  caption,\n  headers,\n  rows,\n  striped = true,\n  compact = false,\n  className,\n}) => {\n  const headerCells = (headers || '')\n    .split('|')\n    .map((cell) => cell.trim())\n    .filter(Boolean);\n\n  const bodyRows = (rows || '')\n    .split('\\n')\n    .map((row) => row.trim())\n    .filter(Boolean)\n    .map((row) => row.split('|').map((cell) => cell.trim()));\n\n  if (headerCells.length === 0 && bodyRows.length === 0) {\n    return null;\n  }\n\n  const cellPadding = compact ? 'px-4 py-2' : 'px-5 py-3.5';\n\n  return (\n    \u003csection className={cn('w-full py-12', className)}>\n      \u003cdiv className=\"mx-auto max-w-7xl px-6\">\n        {(title || intro) && (\n          \u003cdiv className=\"mb-8 flex flex-col gap-3\">\n            {title && (\n              \u003ch2 className=\"text-2xl font-semibold tracking-tight md:text-3xl\">\n                {title}\n              \u003c/h2>\n            )}\n            {intro && (\n              \u003cFormattedText className=\"max-w-2xl leading-relaxed opacity-80\">\n                {intro}\n              \u003c/FormattedText>\n            )}\n          \u003c/div>\n        )}\n\n        \u003cdiv className=\"overflow-x-auto rounded-xl border border-gray-200\">\n          \u003ctable className=\"w-full min-w-max border-collapse text-left text-sm\">\n            {caption && (\n              \u003ccaption className=\"px-5 py-3 text-left text-sm opacity-60\">\n                {caption}\n              \u003c/caption>\n            )}\n            {headerCells.length > 0 && (\n              \u003cthead className=\"bg-gray-50\">\n                \u003ctr>\n                  {headerCells.map((cell) => (\n                    \u003cth\n                      key={cell}\n                      scope=\"col\"\n                      className={cn(\n                        'border-b border-gray-200 font-semibold',\n                        cellPadding,\n                      )}\n                    >\n                      {cell}\n                    \u003c/th>\n                  ))}\n                \u003c/tr>\n              \u003c/thead>\n            )}\n            \u003ctbody>\n              {bodyRows.map((row, i) => (\n                \u003ctr\n                  key={i}\n                  className={cn(\n                    'border-b border-gray-100 last:border-b-0',\n                    striped && i % 2 === 1 && 'bg-gray-50/60',\n                  )}\n                >\n                  {row.map((cell, j) => (\n                    \u003ctd key={j} className={cellPadding}>\n                      {cell}\n                    \u003c/td>\n                  ))}\n                \u003c/tr>\n              ))}\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  );\n};\n\nexport default DataTable;\n",
        "yml": "name: Data Table\nmachineName: data-table\ndescription: >-\n  Scrollable comparison or reference table. Authors type headers separated by\n  pipes and one row per line, also pipe separated - no HTML table markup and no\n  array-of-object props. Use for pricing comparisons, feature matrices,\n  conformance tables, directories and specification listings.\nstatus: true\nrequired:\n  - headers\n  - rows\nprops:\n  properties:\n    title:\n      title: Title\n      type: string\n      examples:\n        - Compare plans\n    intro:\n      title: Intro\n      type: string\n      contentMediaType: text/html\n      x-formatting-context: block\n      examples:\n        - \u003cp>What is included at each tier.\u003c/p>\n    headers:\n      title: Headers\n      type: string\n      examples:\n        - Feature | Starter | Growth | Enterprise\n    rows:\n      title: Rows\n      type: string\n      examples:\n        - \"Users | 5 | 50 | Unlimited\\nSSO | No | Yes | Yes\\nSupport | Email |\n          Business hours | 24/7\"\n    caption:\n      title: Caption\n      type: string\n      examples:\n        - Pricing correct as of March 2026.\n    striped:\n      title: Striped\n      type: boolean\n      examples:\n        - true\n    compact:\n      title: Compact\n      type: boolean\n      examples:\n        - false\nslots: []\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Plan comparison\",\n      \"props\": {\n        \"title\": \"Compare plans\",\n        \"intro\": \"\u003cp>What is included at each tier.\u003c/p>\",\n        \"headers\": \"Feature | Starter | Growth | Enterprise\",\n        \"rows\": \"Users | 5 | 50 | Unlimited\\nSSO | No | Yes | Yes\\nAudit log | No | 30 days | Unlimited\\nSupport | Email | Business hours | 24/7\",\n        \"caption\": \"Pricing correct as of March 2026.\",\n        \"striped\": true\n      }\n    },\n    {\n      \"name\": \"Compact reference\",\n      \"props\": {\n        \"headers\": \"Standard | Level | Status\",\n        \"rows\": \"WCAG 2.2 | AA | Conformant\\nSection 508 | - | Conformant\\nEN 301 549 | - | Partially conformant\",\n        \"compact\": true,\n        \"striped\": false\n      }\n    }\n  ]\n}\n"

        "jsx": "import { cn, FormattedText } from 'drupal-canvas';\n\nconst backgrounds = {\n  white: 'bg-white text-gray-900',\n  light: 'bg-gray-50 text-gray-900',\n  dark: 'bg-gray-900 text-white',\n  primary: 'bg-primary-700 text-white',\n};\n\nconst heights = {\n  auto: 'py-20',\n  medium: 'py-24 md:py-32',\n  tall: 'py-32 md:py-48',\n};\n\nconst HeroMedia = ({ videoUrl, image, title }) => {\n  if (videoUrl) {\n    return (\n      \u003cdiv className=\"aspect-video w-full overflow-hidden rounded-xl\">\n        \u003ciframe\n          src={videoUrl}\n          title={title || 'Hero video'}\n          className=\"h-full w-full\"\n          allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n          allowFullScreen\n        />\n      \u003c/div>\n    );\n  }\n\n  if (image?.src) {\n    return (\n      \u003cimg\n        src={image.src}\n        alt={image.alt || ''}\n        width={image.width}\n        height={image.height}\n        className=\"w-full rounded-xl object-cover\"\n      />\n    );\n  }\n\n  return null;\n};\n\nconst Hero = ({\n  eyebrow,\n  title,\n  body,\n  image,\n  videoUrl,\n  backgroundImage,\n  layout = 'centered',\n  background = 'light',\n  height = 'medium',\n  actions,\n  className,\n}) => {\n  const hasBackdrop = layout === 'backdrop' && backgroundImage?.src;\n\n  return (\n    \u003csection\n      className={cn(\n        'relative w-full overflow-hidden',\n        hasBackdrop ? 'bg-gray-900 text-white' : backgrounds[background],\n        className,\n      )}\n    >\n      {hasBackdrop && (\n        \u003c>\n          \u003cimg\n            src={backgroundImage.src}\n            alt={backgroundImage.alt || ''}\n            className=\"absolute inset-0 h-full w-full object-cover\"\n          />\n          \u003cdiv className=\"absolute inset-0 bg-gray-900/60\" />\n        \u003c/>\n      )}\n\n      \u003cdiv\n        className={cn(\n          'relative mx-auto max-w-7xl px-6',\n          heights[height],\n          layout === 'split'\n            ? 'grid grid-cols-1 items-center gap-12 md:grid-cols-2'\n            : '',\n        )}\n      >\n        \u003cdiv\n          className={cn(\n            'flex flex-col gap-6',\n            layout === 'split'\n              ? 'items-start text-left'\n              : 'mx-auto max-w-3xl items-center text-center',\n          )}\n        >\n          {eyebrow && (\n            \u003cp className=\"text-sm font-semibold tracking-widest uppercase opacity-80\">\n              {eyebrow}\n            \u003c/p>\n          )}\n          {title && (\n            \u003ch1 className=\"text-4xl font-semibold tracking-tight text-balance md:text-6xl\">\n              {title}\n            \u003c/h1>\n          )}\n          {body && (\n            \u003cFormattedText className=\"text-lg leading-relaxed opacity-85 md:text-xl [&_p]:mb-4 [&_p:last-child]:mb-0\">\n              {body}\n            \u003c/FormattedText>\n          )}\n          {actions && (\n            \u003cdiv\n              className={cn(\n                'mt-2 flex flex-wrap gap-4',\n                layout === 'split' ? 'justify-start' : 'justify-center',\n              )}\n            >\n              {actions}\n            \u003c/div>\n          )}\n        \u003c/div>\n\n        {layout === 'split' && (\n          \u003cHeroMedia videoUrl={videoUrl} image={image} title={title} />\n        )}\n      \u003c/div>\n    \u003c/section>\n  );\n};\n\nexport default Hero;\n",
        "yml": "name: Hero\nmachineName: hero\ndescription: >-\n  Top-of-page banner in three layouts - centered copy, split copy plus\n  image/video, or copy over a darkened background photo. Put Button components\n  in the actions slot rather than using CTA label and URL props. Use Page Banner\n  for short interior page titles instead of shrinking this one.\nstatus: true\nrequired:\n  - title\nprops:\n  properties:\n    layout:\n      title: Layout\n      type: string\n      enum:\n        - centered\n        - split\n        - backdrop\n      meta:enum:\n        centered: Centered copy\n        split: Split copy and media\n        backdrop: Copy over background image\n      examples:\n        - centered\n    eyebrow:\n      title: Eyebrow\n      type: string\n      examples:\n        - Introducing\n    title:\n      title: Title\n      type: string\n      examples:\n        - A headline that says exactly what this is\n    body:\n      title: Body\n      type: string\n      contentMediaType: text/html\n      x-formatting-context: block\n      examples:\n        - >-\n          \u003cp>One or two supporting sentences that explain the offer and who it\n          is for.\u003c/p>\n    image:\n      title: Image\n      type: object\n      examples:\n        - src: https://placehold.co/1200x900@2x.png\n          alt: ''\n          width: 1200\n          height: 900\n      $ref: json-schema-definitions://canvas.module/image\n    videoUrl:\n      title: Video Url\n      type: string\n      format: uri-reference\n      examples:\n        - https://www.youtube.com/embed/aqz-KE-bpKQ\n    backgroundImage:\n      title: Background Image\n      type: object\n      examples:\n        - src: https://placehold.co/1920x1080@2x.png\n          alt: ''\n          width: 1920\n          height: 1080\n      $ref: json-schema-definitions://canvas.module/image\n    background:\n      title: Background\n      type: string\n      enum:\n        - white\n        - light\n        - dark\n        - primary\n      meta:enum:\n        white: White\n        light: Light gray\n        dark: Dark\n        primary: Primary\n      examples:\n        - light\n    height:\n      title: Height\n      type: string\n      enum:\n        - auto\n        - medium\n        - tall\n      meta:enum:\n        auto: Auto\n        medium: Medium\n        tall: Tall\n      examples:\n        - medium\nslots:\n  actions:\n    title: Actions\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Centered\",\n      \"props\": {\n        \"layout\": \"centered\",\n        \"eyebrow\": \"Introducing\",\n        \"title\": \"A headline that says exactly what this is\",\n        \"body\": \"\u003cp>One or two supporting sentences that explain the offer and who it is for.\u003c/p>\",\n        \"background\": \"light\",\n        \"height\": \"medium\"\n      },\n      \"slots\": { \"actions\": [\"primary\", \"secondary\"] },\n      \"elements\": {\n        \"primary\": {\n          \"type\": \"button\",\n          \"props\": {\n            \"label\": \"Get started\",\n            \"url\": \"/signup\",\n            \"variant\": \"primary\",\n            \"size\": \"large\"\n          }\n        },\n        \"secondary\": {\n          \"type\": \"button\",\n          \"props\": {\n            \"label\": \"Talk to sales\",\n            \"url\": \"/contact\",\n            \"variant\": \"outline\",\n            \"size\": \"large\"\n          }\n        }\n      }\n    },\n    {\n      \"name\": \"Split with image\",\n      \"props\": {\n        \"layout\": \"split\",\n        \"title\": \"Copy on the left, product shot on the right\",\n        \"body\": \"\u003cp>The split layout is the default for product pages.\u003c/p>\",\n        \"image\": {\n          \"src\": \"https://placehold.co/1200x900@2x.png\",\n          \"alt\": \"\",\n          \"width\": 1200,\n          \"height\": 900\n        },\n        \"background\": \"white\"\n      },\n      \"slots\": { \"actions\": [\"primary\"] },\n      \"elements\": {\n        \"primary\": {\n          \"type\": \"button\",\n          \"props\": {\n            \"label\": \"See the product\",\n            \"url\": \"/product\",\n            \"variant\": \"primary\"\n          }\n        }\n      }\n    },\n    {\n      \"name\": \"Backdrop image\",\n      \"props\": {\n        \"layout\": \"backdrop\",\n        \"eyebrow\": \"Customer story\",\n        \"title\": \"Copy over a darkened photograph\",\n        \"body\": \"\u003cp>Use for editorial and campaign pages.\u003c/p>\",\n        \"backgroundImage\": {\n          \"src\": \"https://placehold.co/1920x1080@2x.png\",\n          \"alt\": \"\",\n          \"width\": 1920,\n          \"height\": 1080\n        },\n        \"height\": \"tall\"\n      }\n    }\n  ]\n}\n"

        "jsx": "import { cn } from 'drupal-canvas';\n\nconst ratios = {\n  auto: '',\n  square: 'aspect-square object-cover',\n  landscape: 'aspect-[4/3] object-cover',\n  wide: 'aspect-video object-cover',\n  portrait: 'aspect-[3/4] object-cover',\n};\n\nconst rounding = {\n  none: 'rounded-none',\n  small: 'rounded-md',\n  medium: 'rounded-xl',\n  full: 'rounded-full',\n};\n\nconst Image = ({\n  image,\n  caption,\n  ratio = 'auto',\n  radius = 'medium',\n  className,\n}) => {\n  if (!image?.src) {\n    return null;\n  }\n\n  const { src, alt, width, height } = image;\n\n  return (\n    \u003cfigure className={cn('w-full', className)}>\n      \u003cimg\n        {...{ src, alt, width, height }}\n        className={cn('w-full', ratios[ratio], rounding[radius])}\n      />\n      {caption && (\n        \u003cfigcaption className=\"mt-2 text-sm text-gray-600\">\n          {caption}\n        \u003c/figcaption>\n      )}\n    \u003c/figure>\n  );\n};\n\nexport default Image;\n",

        "jsx": "import { cn } from 'drupal-canvas';\n\nconst LocationCard = ({\n  name,\n  addressLines,\n  phone,\n  email,\n  hours,\n  mapUrl,\n  image,\n  variant = 'plain',\n  className,\n}) => (\n  \u003cdiv\n    className={cn(\n      'flex h-full flex-col gap-3',\n      variant === 'bordered' && 'rounded-xl border border-current/15 p-6',\n      variant === 'filled' && 'rounded-xl bg-gray-50 p-6',\n      className,\n    )}\n  >\n    {image?.src && (\n      \u003cimg\n        src={image.src}\n        alt={image.alt || ''}\n        width={image.width}\n        height={image.height}\n        className=\"mb-2 aspect-[3/2] w-full rounded-lg object-cover\"\n      />\n    )}\n    {name && \u003ch3 className=\"text-lg font-semibold\">{name}\u003c/h3>}\n    {addressLines && (\n      \u003caddress className=\"text-sm leading-relaxed whitespace-pre-line not-italic opacity-80\">\n        {addressLines}\n      \u003c/address>\n    )}\n    \u003cdl className=\"flex flex-col gap-1 text-sm\">\n      {phone && (\n        \u003cdiv className=\"flex gap-2\">\n          \u003cdt className=\"opacity-60\">Phone\u003c/dt>\n          \u003cdd>\n            \u003ca\n              href={`tel:${phone.replace(/\\s/g, '')}`}\n              className=\"hover:underline\"\n            >\n              {phone}\n            \u003c/a>\n          \u003c/dd>\n        \u003c/div>\n      )}\n      {email && (\n        \u003cdiv className=\"flex gap-2\">\n          \u003cdt className=\"opacity-60\">Email\u003c/dt>\n          \u003cdd>\n            \u003ca href={`mailto:${email}`} className=\"hover:underline\">\n              {email}\n            \u003c/a>\n          \u003c/dd>\n        \u003c/div>\n      )}\n      {hours && (\n        \u003cdiv className=\"flex gap-2\">\n          \u003cdt className=\"opacity-60\">Hours\u003c/dt>\n          \u003cdd>{hours}\u003c/dd>\n        \u003c/div>\n      )}\n    \u003c/dl>\n    {mapUrl && (\n      \u003ca\n        href={mapUrl}\n        target=\"_blank\"\n         "jsx": "import { useState } from 'react';\nimport { cn } from 'drupal-canvas';\n\nconst NavItem = ({ label, url, active = false, panel, className }) => {\n  const [open, setOpen] = useState(false);\n  const hasPanel = Boolean(panel);\n\n  if (!label) {\n    return null;\n  }\n\n  return (\n    \u003cli\n      className={cn('relative list-none', className)}\n      onMouseEnter={hasPanel ? () => setOpen(true) : undefined}\n      onMouseLeave={hasPanel ? () => setOpen(false) : undefined}\n    >\n      \u003cdiv className=\"flex items-center gap-1\">\n        \u003ca\n          href={url || '/'}\n          aria-current={active ? 'page' : undefined}\n          className={cn(\n            'py-2 text-sm font-medium hover:underline',\n            active && 'underline underline-offset-4',\n          )}\n        >\n          {label}\n        \u003c/a>\n        {hasPanel && (\n          \u003cbutton\n            type=\"button\"\n            aria-expanded={open}\n            aria-label={`Toggle ${label} menu`}\n            onClick={() => setOpen((value) => !value)}\n            className=\"p-1\"\n          >\n            \u003csvg\n              viewBox=\"0 0 24 24\"\n              aria-hidden=\"true\"\n              className={cn(\n                'h-3 w-3 transition-transform',\n                open && 'rotate-180',\n              )}\n              fill=\"none\"\n              stroke=\"currentColor\"\n              strokeWidth=\"2.5\"\n            >\n              \u003cpath d=\"M5 8l7 7 7-7\" strokeLinecap=\"round\" />\n            \u003c/svg>\n          \u003c/button>\n        )}\n      \u003c/div>\n\n      {hasPanel && open && (\n        \u003cdiv className=\"z-50 mt-1 w-full rounded-xl border border-gray-200 bg-white p-4 text-gray-900 shadow-lg lg:absolute lg:top-full lg:left-0 lg:mt-0 lg:w-max lg:min-w-64\">\n          {panel}\n        \u003c/div>\n      )}\n    \u003c/li>\n  );\n};\n\nexport default NavItem;\n",

        "jsx": "import ArticleCard from '@/components/article-card';\nimport { cn, FormattedText, JsonApiClient } from 'drupal-canvas';\nimport { DrupalJsonApiParams } from 'drupal-jsonapi-params';\nimport useSWR from 'swr';\n\nconst client = new JsonApiClient();\n\nconst columns = {\n  1: 'grid-cols-1',\n  2: 'sm:grid-cols-2',\n  3: 'sm:grid-cols-2 lg:grid-cols-3',\n  4: 'sm:grid-cols-2 lg:grid-cols-4',\n};\n\nconst backgrounds = {\n  none: '',\n  white: 'bg-white text-gray-900',\n  light: 'bg-gray-50 text-gray-900',\n  dark: 'bg-gray-900 text-white',\n};\n\nconst formatDate = (iso) => {\n  if (!iso) {\n    return '';\n  }\n  return new Intl.DateTimeFormat('en-GB', {\n    day: 'numeric',\n    month: 'long',\n    year: 'numeric',\n  }).format(new Date(iso));\n};\n\nconst NewsFeed = ({\n  title,\n  intro,\n  entityType = 'node--article',\n  imageField = 'field_image',\n  summaryField = 'field_summary',\n  itemCount = 6,\n  columnCount = 3,\n  sortField = 'created',\n  background = 'none',\n  cardVariant = 'plain',\n  viewAllLabel,\n  viewAllUrl,\n  className,\n}) => {\n  const { data, isLoading, error } = useSWR(\n    [\n      entityType,\n      {\n        queryString: new DrupalJsonApiParams()\n          .addInclude([imageField, 'uid'])\n          .addSort(sortField, 'DESC')\n          .addPageLimit(itemCount)\n          .getQueryString(),\n      },\n    ],\n    ([type, options]) => client.getCollection(type, options),\n  );\n\n  const articles = Array.isArray(data) ? data : [];\n\n  return (\n    \u003csection className={cn('w-full py-16', backgrounds[background], className)}>\n      \u003cdiv className=\"mx-auto max-w-7xl px-6\">\n        {(title || intro) && (\n          \u003cdiv className=\"mb-10 flex flex-col gap-3\">\n            {title && (\n              \u003ch2 className=\"text-3xl font-semibold tracking-tight md:text-4xl\">\n                {title}\n              \u003c/h2>\n            )}\n            {intro && (\n              \u003cFormattedText className=\"max-w-2xl text-lg leading-relaxed opacity-80\">\n                {intro}\n              \u003c/FormattedText>\n            )}\n          \u003c/div>\n        )}\n\n        {isLoading && (\n          \u003cdiv className={cn('grid grid-cols-1 gap-8', columns[columnCount])}>\n            {Array.from({ length: Math.min(itemCount, columnCount) }).map(\n              (_, i) => (\n                \u003cdiv key={i} className=\"animate-pulse\">\n                  \u003cdiv className=\"aspect-[3/2] w-full rounded-xl bg-current/10\" />\n                  \u003cdiv className=\"mt-4 h-4 w-3/4 rounded bg-current/10\" />\n                  \u003cdiv className=\"mt-2 h-4 w-1/2 rounded bg-current/10\" />\n                \u003c/div>\n              ),\n            )}\n          \u003c/div>\n        )}\n\n        {!isLoading && articles.length === 0 && (\n          \u003cp className=\"rounded-xl border border-dashed border-current/25 p-10 text-center opacity-60\">\n            {error\n              ? 'Content could not be loaded. Check that the entity type exists and JSON:API is enabled.'\n              : `No ${entityType} content found yet.`}\n          \u003c/p>\n        )}\n\n        {articles.length > 0 && (\n          \u003cdiv className={cn('grid grid-cols-1 gap-8', columns[columnCount])}>\n            {articles.map((article) => (\n              \u003cArticleCard\n                key={article.id}\n                title={article.title}\n                url={\n                  article.path?.alias || `/node/${article.drupal_internal__nid}`\n                }\n                summary={\n                  article[summaryField] || article.body?.summary || undefined\n                }\n                image={\n                  article[imageField]?.uri?.url\n                    ? {\n                        src: article[imageField].uri.url,\n                        alt: article[imageField].resourceIdObjMeta?.alt || '',\n                      }\n                    : undefined\n                }\n                date={formatDate(article.created)}\n                author={article.uid?.display_name}\n                variant={cardVariant}\n              />\n            ))}\n          \u003c/div>\n        )}\n\n        {viewAllLabel && viewAllUrl && (\n          \u003cdiv className=\"mt-12 flex justify-center\">\n            \u003ca\n              href={viewAllUrl}\n              className=\"rounded-md border border-current/30 px-6 py-3 font-semibold hover:bg-current/5\"\n            >\n              {viewAllLabel}\n            \u003c/a>\n          \u003c/div>\n        )}\n      \u003c/div>\n    \u003c/section>\n  );\n};\n\nexport default NewsFeed;\n",
        "yml": "name: News Feed\nmachineName: news-feed\ndescription: >-\n  Live listing of Drupal content pulled over JSON:API and rendered as Article\n  Cards - the automatic counterpart to hand-placing cards in a Card Grid. Point\n  Entity Type at any node bundle (node--article, node--news, node--case_study)\n  and adjust the image and summary field names to match that bundle. Requires\n  JSON:API to be enabled on the site; it shows a skeleton while loading and an\n  explicit empty state when nothing is returned.\nstatus: true\nrequired: []\nprops:\n  properties:\n    title:\n      title: Title\n      type: string\n      examples:\n        - Latest news\n    intro:\n      title: Intro\n      type: string\n      contentMediaType: text/html\n      x-formatting-context: block\n      examples:\n        - \u003cp>Product updates, research and practical guides.\u003c/p>\n    entityType:\n      title: Entity Type\n      type: string\n      examples:\n        - node--article\n    imageField:\n      title: Image Field\n      type: string\n      examples:\n        - field_image\n    summaryField:\n      title: Summary Field\n      type: string\n      examples:\n        - field_summary\n    sortField:\n      title: Sort Field\n      type: string\n      examples:\n        - created\n    itemCount:\n      title: Item Count\n      type: integer\n      examples:\n        - 6\n    columnCount:\n      title: Column Count\n      type: integer\n      enum:\n        - 1\n        - 2\n        - 3\n        - 4\n      meta:enum:\n        1: One\n        2: Two\n        3: Three\n        4: Four\n      examples:\n        - 3\n    cardVariant:\n      title: Card Variant\n      type: string\n      enum:\n        - plain\n        - bordered\n        - elevated\n      meta:enum:\n        plain: Plain\n        bordered: Bordered\n        elevated: Elevated\n      examples:\n        - plain\n    background:\n      title: Background\n      type: string\n      enum:\n        - none\n        - white\n        - light\n        - dark\n      meta:enum:\n        none: None (inherit)\n        white: White\n        light: Light gray\n        dark: Dark\n      examples:\n        - none\n    viewAllLabel:\n      title: View All Label\n      type: string\n      examples:\n        - See all news\n    viewAllUrl:\n      title: View All Url\n      type: string\n      format: uri-reference\n      examples:\n        - /news\nslots: []\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Articles, three across\",\n      \"props\": {\n        \"title\": \"Latest news\",\n        \"intro\": \"\u003cp>Product updates, research and practical guides.\u003c/p>\",\n        \"entityType\": \"node--article\",\n        \"itemCount\": 6,\n        \"columnCount\": 3,\n        \"viewAllLabel\": \"See all news\",\n        \"viewAllUrl\": \"/news\"\n      }\n    },\n    {\n      \"name\": \"Case studies\",\n      \"props\": {\n        \"title\": \"Customer stories\",\n        \"entityType\": \"node--case_study\",\n        \"itemCount\": 4,\n        \"columnCount\": 2,\n        \"cardVariant\": \"bordered\",\n        \"background\": \"light\"\n      }\n    }\n  ]\n}\n"

"submit\"\n            className=\"h-12 shrink-0 rounded-md bg-primary-600 px-6 font-semibold text-white hover:bg-primary-700\"\n          >\n            {buttonLabel}\n          \u003c/button>\n        \u003c/div>\n        {consentText && (\n          \u003cp className=\"mt-3 text-xs leading-relaxed opacity-70\">\n            {consentText}\n          \u003c/p>\n        )}\n      \u003c/form>\n    \u003c/div>\n  \u003c/section>\n);\n\nexport default NewsletterSignup;\n",

        "jsx": "import { cn, FormattedText } from 'drupal-canvas';\n\nconst backgrounds = {\n  white: 'bg-white text-gray-900',\n  light: 'bg-gray-50 text-gray-900',\n  dark: 'bg-gray-900 text-white',\n  primary: 'bg-primary-700 text-white',\n};\n\nconst aligns = {\n  left: 'text-left items-start',\n  center: 'text-center items-center mx-auto',\n};\n\nconst PageBanner = ({\n  eyebrow,\n  title,\n  intro,\n  backgroundImage,\n  background = 'light',\n  align = 'left',\n  breadcrumb,\n  className,\n}) => {\n  const hasImage = Boolean(backgroundImage?.src);\n\n  return (\n    \u003csection\n      className={cn(\n        'relative w-full overflow-hidden',\n        hasImage ? 'bg-gray-900 text-white' : backgrounds[background],\n        className,\n      )}\n    >\n      {hasImage && (\n        \u003c>\n          \u003cimg\n            src={backgroundImage.src}\n            alt={backgroundImage.alt || ''}\n            className=\"absolute inset-0 h-full w-full object-cover\"\n          />\n          \u003cdiv className=\"absolute inset-0 bg-gray-900/65\" />\n        \u003c/>\n      )}\n      \u003cdiv className=\"relative mx-auto max-w-7xl px-6 py-14 md:py-20\">\n        {breadcrumb && \u003cdiv className=\"mb-6\">{breadcrumb}\u003c/div>}\n        \u003cdiv className={cn('flex max-w-3xl flex-col gap-3', aligns[align])}>\n          {eyebrow && (\n            \u003cp className=\"text-sm font-semibold tracking-widest uppercase opacity-75\">\n              {eyebrow}\n            \u003c/p>\n          )}\n          {title && (\n            \u003ch1 className=\"text-3xl font-semibold tracking-tight text-balance md:text-5xl\">\n              {title}\n            \u003c/h1>\n          )}\n          {intro && (\n            \u003cFormattedText className=\"text-lg leading-relaxed opacity-85 [&_p]:mb-3 [&_p:last-child]:mb-0\">\n              {intro}\n            \u003c/FormattedText>\n          )}\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  );\n};\n\nexport default PageBanner;\n",

      "src": {
        "jsx": "import { cn } from 'drupal-canvas';\n\nconst buildPages = (current, total) => {\n  const pages = new Set([1, total, current, current - 1, current + 1]);\n  return [...pages].filter((p) => p >= 1 && p \u003c= total).sort((a, b) => a - b);\n};\n\nconst Pagination = ({\n  currentPage,\n  totalPages,\n  baseUrl = '/',\n  pageParam = 'page',\n  previousLabel = 'Previous',\n  nextLabel = 'Next',\n  className,\n}) => {\n  if (!totalPages || totalPages \u003c= 1 || !currentPage) {\n    return null;\n  }\n\n  const href = (page) =>\n    `${baseUrl}${baseUrl.includes('?') ? '&' : '?'}${pageParam}=${page}`;\n  const pages = buildPages(currentPage, totalPages);\n  const link =\n    'inline-flex h-10 min-w-10 items-center justify-center rounded-md border border-gray-300 px-3 text-sm hover:bg-gray-50';\n\n  return (\n    \u003cnav aria-label=\"Pagination\" className={cn('w-full py-8', className)}>\n      \u003cul className=\"flex flex-wrap items-center justify-center gap-2\">\n        \u003cli className=\"list-none\">\n          {currentPage > 1 ? (\n            \u003ca href={href(currentPage - 1)} className={link}>\n              {previousLabel}\n            \u003c/a>\n          ) : (\n            \u003cspan className={cn(link, 'opacity-40')}>{previousLabel}\u003c/span>\n          )}\n        \u003c/li>\n        {pages.map((page, i) => (\n          \u003cli key={page} className=\"flex list-none items-center gap-2\">\n            {i > 0 && page - pages[i - 1] > 1 && (\n              \u003cspan className=\"px-1 opacity-50\">…\u003c/span>\n            )}\n            {page === currentPage ? (\n              \u003cspan\n                aria-current=\"page\"\n                className={cn(\n                  link,\n                  'border-primary-600 bg-primary-600 font-semibold text-white',\n                )}\n              >\n                {page}\n              \u003c/span>\n            ) : (\n              \u003ca href={href(page)} className={link}>\n                {page}\n              \u003c/a>\n            )}\n          \u003c/li>\n        ))}\n        \u003cli className=\"list-none\">\n          {currentPage \u003c totalPages ? (\n            \u003ca href={href(currentPage + 1)} className={link}>\n              {nextLabel}\n            \u003c/a>\n          ) : (\n            \u003cspan className={cn(link, 'opacity-40')}>{nextLabel}\u003c/span>\n          )}\n        \u003c/li>\n      \u003c/ul>\n    \u003c/nav>\n  );\n};\n\nexport default Pagination;\n",
        "yml": "name: Pagination\nmachineName: pagination\ndescription: >-\n  Page links for a long listing, with first/last always visible and an ellipsis\n  in between. Links are plain URLs with a query parameter, so it works with\n  server-rendered listings and with News Feed.\nstatus: true\nrequired:\n  - currentPage\n  - totalPages\nprops:\n  properties:\n    currentPage:\n      title: Current Page\n      type: integer\n      examples:\n        - 3\n    totalPages:\n      title: Total Pages\n      type: integer\n      examples:\n        - 12\n    baseUrl:\n      title: Base Url\n      type: string\n      format: uri-reference\n      examples:\n        - /blog\n    pageParam:\n      title: Page Param\n      type: string\n      examples:\n        - page\n    previousLabel:\n      title: Previous Label\n      type: string\n      examples:\n        - Previous\n    nextLabel:\n      title: Next Label\n      type: string\n      examples:\n        - Next\nslots: []\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Middle of a long list\",\n      \"props\": { \"currentPage\": 5, \"totalPages\": 12, \"baseUrl\": \"/blog\" }\n    },\n    {\n      \"name\": \"First page\",\n      \"props\": { \"currentPage\": 1, \"totalPages\": 4, \"baseUrl\": \"/resources\" }\n    }\n  ]\n}\n"

        "jsx": "import { cn, FormattedText } from 'drupal-canvas';\n\nconst ProductCard = ({\n  name,\n  image,\n  price,\n  compareAtPrice,\n  description,\n  badgeLabel,\n  url,\n  ctaLabel,\n  variant = 'plain',\n  className,\n}) => {\n  if (!name) {\n    return null;\n  }\n\n  return (\n    \u003carticle\n      className={cn(\n        'group relative flex h-full flex-col overflow-hidden',\n        variant === 'bordered' && 'rounded-xl border border-gray-200',\n        variant === 'elevated' && 'rounded-xl bg-white shadow-md',\n        className,\n      )}\n    >\n      {badgeLabel && (\n        \u003cspan className=\"absolute top-3 left-3 z-10 rounded-full bg-gray-900 px-3 py-1 text-xs font-semibold text-white\">\n          {badgeLabel}\n        \u003c/span>\n      )}\n      {image?.src && (\n        \u003ca href={url || '/'} className=\"block overflow-hidden bg-gray-50\">\n          \u003cimg\n            src={image.src}\n            alt={image.alt || ''}\n            width={image.width}\n            height={image.height}\n            className=\"aspect-square w-full object-cover transition-transform duration-300 group-hover:scale-105\"\n          />\n        \u003c/a>\n      )}\n      \u003cdiv\n        className={cn(\n          'flex flex-1 flex-col gap-2',\n          variant === 'plain' ? 'pt-4' : 'p-5',\n        )}\n      >\n        \u003ch3 className=\"font-semibold\">\n          \u003ca href={url || '/'} className=\"hover:underline\">\n            {name}\n          \u003c/a>\n        \u003c/h3>\n        {description && (\n          \u003cFormattedText className=\"text-sm leading-relaxed opacity-70\">\n            {description}\n          \u003c/FormattedText>\n        )}\n        {price && (\n          \u003cp className=\"mt-1 flex items-baseline gap-2\">\n            \u003cspan className=\"text-lg font-semibold\">{price}\u003c/span>\n            {compareAtPrice && (\n              \u003cspan className=\"text-sm line-through opacity-50\">\n       "description": "\"More like this\" band for the bottom of an article page. Pulls recent content of the same bundle over JSON:API and excludes the node currently being viewed, so it is only meaningful inside a content template or on a node page. Renders nothing when there is nothing else to show. For a listing that is not tied to the current node, use News Feed.",

      "flags": {
        "slots": false,
        "image": false,
        "data": true,

        "richtext": false
      },
      "usedOn": ["Component libraries that scale"],
      "src": {
        "jsx": "import ArticleCard from '@/components/article-card';\nimport { cn, getPageData, JsonApiClient } from 'drupal-canvas';\nimport { DrupalJsonApiParams } from 'drupal-jsonapi-params';\nimport useSWR from 'swr';\n\nconst client = new JsonApiClient();\n\nconst columns = {\n  2: 'sm:grid-cols-2',\n  3: 'sm:grid-cols-2 lg:grid-cols-3',\n  4: 'sm:grid-cols-2 lg:grid-cols-4',\n};\n\nconst formatDate = (iso) => {\n  if (!iso) {\n    return '';\n  }\n  return new Intl.DateTimeFormat('en-GB', {\n    day: 'numeric',\n    month: 'long',\n    year: 'numeric',\n  }).format(new Date(iso));\n};\n\nconst RelatedArticles = ({\n  title = 'More like this',\n  entityType = 'node--article',\n  imageField = 'field_image',\n  itemCount = 3,\n  columnCount = 3,\n  className,\n}) => {\n  const currentUuid = getPageData()?.entity?.uuid;\n\n  const params = new DrupalJsonApiParams()\n    .addInclude([imageField, 'uid'])\n    .addSort('created', 'DESC')\n    .addPageLimit(itemCount);\n\n  if (currentUuid) {\n    params.addFilter('id', currentUuid, '\u003c>');\n  }\n\n  const { data, isLoading } = useSWR(\n    [entityType, { queryString: params.getQueryString() }],\n    ([type, options]) => client.getCollection(type, options),\n  );\n\n  const articles = Array.isArray(data) ? data : [];\n\n  if (!isLoading && articles.length === 0) {\n    return null;\n  }\n\n  return (\n    \u003csection className={cn('w-full py-12', className)}>\n      \u003cdiv className=\"mx-auto max-w-7xl px-6\">\n        {title && (\n          \u003ch2 className=\"mb-8 text-2xl font-semibold tracking-tight\">\n            {title}\n          \u003c/h2>\n        )}\n        \u003cdiv className={cn('grid grid-cols-1 gap-8', columns[columnCount])}>\n          {articles.map((article) => (\n            \u003cArticleCard\n              key={article.id}\n              title={article.title}\n              url={\n                article.path?.alias || `/node/${article.drupal_internal__nid}`\n              }\n              image={\n                article[imageField]?.uri?.url\n                  ? {\n                      src: article[imageField].uri.url,\n                      alt: article[imageField].resourceIdObjMeta?.alt || '',\n                    }\n                  : undefined\n              }\n              date={formatDate(article.created)}\n              author={article.uid?.display_name}\n            />\n          ))}\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  );\n};\n\nexport default RelatedArticles;\n",
        "yml": "name: Related Articles\nmachineName: related-articles\ndescription: >-\n  \"More like this\" band for the bottom of an article page. Pulls recent content\n  of the same bundle over JSON:API and excludes the node currently being viewed,\n  so it is only meaningful inside a content template or on a node page. Renders\n  nothing when there is nothing else to show. For a listing that is not tied to\n  the current node, use News Feed.\nstatus: true\nrequired: []\nprops:\n  properties:\n    title:\n      title: Title\n      type: string\n      examples:\n        - More like this\n    entityType:\n      title: Entity Type\n      type: string\n      examples:\n        - node--article\n    imageField:\n      title: Image Field\n      type: string\n      examples:\n        - field_image\n    itemCount:\n      title: Item Count\n      type: integer\n      examples:\n        - 3\n    columnCount:\n      title: Column Count\n      type: integer\n      enum:\n        - 2\n        - 3\n        - 4\n      meta:enum:\n        2: Two\n        3: Three\n        4: Four\n      examples:\n        - 3\nslots: []\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Three articles\",\n      \"props\": {\n        \"title\": \"More like this\",\n        \"entityType\": \"node--article\",\n        \"itemCount\": 3,\n        \"columnCount\": 3\n      }\n    }\n  ]\n}\n"
      },
