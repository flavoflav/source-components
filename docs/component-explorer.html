        "jsx": "import { cn } from 'drupal-canvas';\n\nconst ResourceCard = ({\n  title,\n  url,\n  summary,\n  resourceType,\n  coverImage,\n  fileFormat,\n  fileSize,\n  gated = false,\n  linkLabel = 'Download',\n  variant = 'bordered',\n  className,\n}) => (\n  \u003carticle\n    className={cn(\n      'group flex h-full gap-5',\n      variant === 'bordered' && 'rounded-xl border border-gray-200 p-5',\n      variant === 'filled' && 'rounded-xl bg-gray-50 p-5',\n      className,\n    )}\n  >\n    {coverImage?.src && (\n      \u003cimg\n        src={coverImage.src}\n        alt={coverImage.alt || ''}\n        width={coverImage.width}\n        height={coverImage.height}\n        className=\"h-32 w-24 shrink-0 rounded-md object-cover shadow-sm\"\n      />\n    )}\n    \u003cdiv className=\"flex flex-1 flex-col gap-2\">\n      {resourceType && (\n        \u003cp className=\"text-xs font-semibold tracking-widest uppercase opacity-60\">\n          {resourceType}\n        \u003c/p>\n      )}\n      {title && (\n        \u003ch3 className=\"leading-snug font-semibold\">\n          \u003ca href={url || '/'} className=\"hover:underline\">\n            {title}\n          \u003c/a>\n        \u003c/h3>\n      )}\n      {summary && (\n        \u003cp className=\"line-clamp-3 text-sm leading-relaxed opacity-75\">\n          {summary}\n        \u003c/p>\n      )}\n      \u003cp className=\"mt-auto flex flex-wrap items-center gap-x-3 gap-y-1 pt-3 text-xs opacity-60\">\n        {fileFormat && \u003cspan className=\"font-semibold\">{fileFormat}\u003c/span>}\n        {fileSize && \u003cspan>{fileSize}\u003c/span>}\n        {gated && \u003cspan>Registration required\u003c/span>}\n      \u003c/p>\n      {url && (\n        \u003ca\n          href={url}\n          className=\"text-sm font-semibold underline underline-offset-4 hover:no-underline\"\n        >\n          {linkLabel}\n        \u003c/a>\n      )}\n    \u003c/div>\n  \u003c/article>\n);\n\nexport default ResourceCard;\n",
        "yml": "name: Resource Card\nmachineName: resource-card\ndescription: >-\n  Downloadable asset teaser - report, whitepaper, datasheet or guide - with\n  cover thumbnail, format, file size and a gated flag. Put several in a Card\n  Grid to build a resource centre, or in Data Table for a dense document\n  library.\nstatus: true\nrequired:\n  - title\n  - url\nprops:\n  properties:\n    title:\n      title: Title\n      type: string\n      examples:\n        - The 2026 digital experience benchmark\n    url:\n      title: Url\n      type: string\n      format: uri-reference\n      examples:\n        - /resources/benchmark-2026\n    summary:\n      title: Summary\n      type: string\n      examples:\n        - Survey data from 1,200 teams on how they build and govern their sites.\n    resourceType:\n      title: Resource Type\n      type: string\n      examples:\n        - Report\n    coverImage:\n      title: Cover Image\n      type: object\n      examples:\n        - src: https://placehold.co/480x640@2x.png\n          alt: ''\n          width: 480\n          height: 640\n      $ref: json-schema-definitions://canvas.module/image\n    fileFormat:\n      title: File Format\n      type: string\n      examples:\n        - PDF\n    fileSize:\n      title: File Size\n      type: string\n      examples:\n        - 2.4 MB\n    gated:\n      title: Gated\n      type: boolean\n      examples:\n        - false\n    linkLabel:\n      title: Link Label\n      type: string\n      examples:\n        - Download\n    variant:\n      title: Variant\n      type: string\n      enum:\n        - plain\n        - bordered\n        - filled\n      meta:enum:\n        plain: Plain\n        bordered: Bordered\n        filled: Filled\n      examples:\n        - bordered\nslots: []\n",

copyright && \u003cp>{copyright}\u003c/p>}\n        {legal && \u003cdiv className=\"flex flex-wrap gap-x-6 gap-y-2\">{legal}\u003c/div>}\n      \u003c/div>\n    \u003c/div>\n  \u003c/footer>\n);\n\nexport default SiteFooter;\n",
        "yml": "name: Site Footer\nmachineName: site-footer\ndescription: >-\n  Site chrome at the bottom of every page - brand block with tagline and social\n  icons on the left, several Link List columns on the right, and a legal row\n  underneath. Place this in the footer region, not on individual pages.\nstatus: true\nrequired: []\nprops:\n  properties:\n    logo:\n      title: Logo\n      type: object\n      examples:\n        - src: https://placehold.co/200x48@2x.png\n          alt: Company logo\n          width: 200\n          height: 48\n      $ref: json-schema-definitions://canvas.module/image\n    logoUrl:\n      title: Logo Url\n      type: string\n      format: uri-reference\n      examples:\n        - /\n    siteName:\n      title: Site Name\n      type: string\n      examples:\n        - Acme\n    tagline:\n      title: Tagline\n      type: string\n      examples:\n        - The governed platform for modern digital experiences.\n    copyright:\n      title: Copyright\n      type: string\n      examples:\n        - © 2026 Acme, Inc. All rights reserved.\n    columnCount:\n      title: Column Count\n      type: integer\n      enum:\n        - 2\n        - 3\n        - 4\n        - 5\n      meta:enum:\n        2: Two\n        3: Three\n        4: Four\n        5: Five\n      examples:\n        - 4\n    variant:\n      title: Variant\n      type: string\n      enum:\n        - dark\n        - light\n        - white\n      meta:enum:\n        dark: Dark\n        light: Light gray\n        white: White\n      examples:\n        - dark\nslots:\n  linkColumns:\n    title: Link columns\n  social:\n    title: Social\n  legal:\n    title: Legal links\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Dark with four columns\",\n      \"props\": {\n        \"siteName\": \"Acme\",\n        \"tagline\": \"The governed platform for modern digital experiences.\",\n        \"copyright\": \"© 2026 Acme, Inc. All rights reserved.\",\n        \"columnCount\": 3,\n        \"variant\": \"dark\"\n      },\n      \"slots\": {\n        \"linkColumns\": [\"c1\", \"c2\", \"c3\"],\n        \"social\": [\"soc\"],\n        \"legal\": [\"l1\", \"l2\"]\n      },\n      \"elements\": {\n        \"c1\": {\n          \"type\": \"link-list\",\n          \"props\": { \"heading\": \"Product\" },\n          \"slots\": { \"items\": [\"p1\", \"p2\"] }\n        },\n        \"p1\": {\n          \"type\": \"link-item\",\n          \"props\": { \"label\": \"Platform\", \"url\": \"/platform\" }\n        },\n        \"p2\": {\n          \"type\": \"link-item\",\n          \"props\": { \"label\": \"Pricing\", \"url\": \"/pricing\" }\n        },\n        \"c2\": {\n          \"type\": \"link-list\",\n          \"props\": { \"heading\": \"Company\" },\n          \"slots\": { \"items\": [\"q1\", \"q2\"] }\n        },\n        \"q1\": {\n          \"type\": \"link-item\",\n          \"props\": { \"label\": \"About\", \"url\": \"/about\" }\n        },\n        \"q2\": {\n          \"type\": \"link-item\",\n          \"props\": { \"label\": \"Careers\", \"url\": \"/careers\" }\n        },\n        \"c3\": {\n          \"type\": \"link-list\",\n          \"props\": { \"heading\": \"Resources\" },\n          \"slots\": { \"items\": [\"r1\"] }\n        },\n        \"r1\": {\n          \"type\": \"link-item\",\n          \"props\": { \"label\": \"Documentation\", \"url\": \"/docs\" }\n        },\n        \"soc\": {\n          \"type\": \"social-links\",\n          \"props\": {\n            \"linkedinUrl\": \"https://linkedin.com/company/example\",\n            \"youtubeUrl\": \"https://youtube.com/@example\"\n          }\n        },\n        \"l1\" e=\"h-5 w-5\"\n            fill=\"none\"\n            stroke=\"currentColor\"\n            strokeWidth=\"2\"\n          >\n            {open ? (\n              \u003cpath d=\"M6 6l12 12M18 6L6 18\" strokeLinecap=\"round\" />\n            ) : (\n              \u003cpath d=\"M4 7h16M4 12h16M4 17h16\" strokeLinecap=\"round\" />\n            )}\n          \u003c/svg>\n        \u003c/button>\n      \u003c/div>\n\n      {open && (\n        \u003cdiv className=\"border-t border-current/15 px-6 py-6 lg:hidden\">\n          \u003cdiv className=\"flex flex-col gap-6\">\n            {navigation}\n            {actions && \u003cdiv className=\"flex flex-wrap gap-3\">{actions}\u003c/div>}\n          \u003c/div>\n        \u003c/div>\n      )}\n    \u003c/header>\n  );\n};\n\nexport default SiteHeader;\n",

      "src": {
        "jsx": "import { cn, FormattedText } from 'drupal-canvas';\n\nconst variants = {\n  plain: '',\n  bordered: 'rounded-xl border border-gray-200 overflow-hidden',\n  elevated: 'rounded-xl bg-white shadow-md overflow-hidden',\n  dark: 'rounded-xl bg-gray-900 text-white overflow-hidden',\n};\n\nconst StoryCard = ({\n  customerName,\n  logo,\n  image,\n  headline,\n  summary,\n  statValue,\n  statLabel,\n  url,\n  linkLabel = 'Read the story',\n  variant = 'bordered',\n  className,\n}) => (\n  \u003carticle\n    className={cn('group flex h-full flex-col', variants[variant], className)}\n  >\n    {image?.src && (\n      \u003cimg\n        src={image.src}\n        alt={image.alt || ''}\n        width={image.width}\n        height={image.height}\n        className=\"aspect-[3/2] w-full object-cover\"\n      />\n    )}\n    \u003cdiv\n      className={cn(\n        'flex flex-1 flex-col gap-4',\n        variant === 'plain' ? 'pt-5' : 'p-6',\n      )}\n    >\n      {logo?.src ? (\n        \u003cimg\n          src={logo.src}\n          alt={logo.alt || customerName || ''}\n          width={logo.width}\n          height={logo.height}\n          className=\"max-h-7 w-auto self-start object-contain opacity-80\"\n        />\n      ) : (\n        customerName && (\n          \u003cp className=\"text-xs font-semibold tracking-widest uppercase opacity-60\">\n            {customerName}\n          \u003c/p>\n        )\n      )}\n      {headline && (\n        \u003ch3 className=\"text-lg leading-snug font-semibold\">\n          \u003ca href={url || '/'} className=\"hover:underline\">\n            {headline}\n          \u003c/a>\n        \u003c/h3>\n      )}\n      {summary && (\n        \u003cFormattedText className=\"text-sm leading-relaxed opacity-75\">\n          {summary}\n        \u003c/FormattedText>\n      )}\n      {statValue && (\n        \u003cp className=\"mt-2\">\n          \u003cspan className=\"block text-3xl font-semibold tracking-tight tabular-nums\">\n         "yml": "name: Story Card\nmachineName: story-card\ndescription: >-\n  Customer story teaser - logo or customer name, headline, summary and one\n  headline result figure. Use for case-study grids and customer-spotlight bands;\n  for a pure quote use Testimonial Card, for editorial content use Article Card.\nstatus: true\nrequired:\n  - headline\n  - url\nprops:\n  properties:\n    customerName:\n      title: Customer Name\n      type: string\n      examples:\n        - Northwind\n    logo:\n      title: Logo\n      type: object\n      examples:\n        - src: https://placehold.co/240x80@2x.png\n          alt: Northwind\n          width: 240\n          height: 80\n      $ref: json-schema-definitions://canvas.module/image\n    image:\n      title: Image\n      type: object\n      examples:\n        - src: https://placehold.co/900x600@2x.png\n          alt: ''\n          width: 900\n          height: 600\n      $ref: json-schema-definitions://canvas.module/image\n    headline:\n      title: Headline\n      type: string\n      examples:\n        - Cut publishing time from three days to one hour\n    summary:\n      title: Summary\n      type: string\n      contentMediaType: text/html\n      x-formatting-context: block\n      examples:\n        - \u003cp>How a 200-person marketing team moved to a component-based\n          workflow.\u003c/p>\n    statValue:\n      title: Stat Value\n      type: string\n      examples:\n        - 72%\n    statLabel:\n      title: Stat Label\n      type: string\n      examples:\n        - faster time to publish\n    url:\n      title: Url\n      type: string\n      format: uri-reference\n      examples:\n        - /customers/northwind\n    linkLabel:\n      title: Link Label\n      type: string\n      examples:\n        - Read the story\n    variant:\n      title: Variant\n      type: string\n      enum:\n        - plain\n        - bordered\n        - elevated\n        - dark\n      meta:enum:\n        plain: Plain\n        bordered: Bordered\n        elevated: Elevated\n        dark: Dark\n      examples:\n        - bordered\nslots: []\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"With image and stat\",\n      \"props\": {\n        \"customerName\": \"Northwind\",\n        \"image\": {\n          \"src\": \"https://placehold.co/900x600@2x.png\",\n          \"alt\": \"\",\n          \"width\": 900,\n          \"height\": 600\n        },\n        \"headline\": \"Cut publishing time from three days to one hour\",\n        \"summary\": \"\u003cp>How a 200-person marketing team moved to a component-based workflow.\u003c/p>\",\n        \"statValue\": \"72%\",\n        \"statLabel\": \"faster time to publish\",\n        \"url\": \"/customers/northwind\",\n        \"variant\": \"bordered\"\n      }\n    },\n    {\n      \"name\": \"Dark, logo only\",\n      \"props\": {\n        \"logo\": {\n          \"src\": \"https://placehold.co/240x80@2x.png\",\n          \"alt\": \"Meridian\",\n          \"width\": 240,\n          \"height\": 80\n        },\n        \"headline\": \"Consolidated 14 sites onto one platform\",\n        \"statValue\": \"$4.2M\",\n        \"statLabel\": \"saved annually\",\n        \"url\": \"/customers/meridian\",\n        \"variant\": \"dark\"\n      }\n    }\n  ]\n}\n"

        "jsx": "import { cn, FormattedText } from 'drupal-canvas';\n\nconst TabPanel = ({ title, body, image, content, actions, className }) => (\n  \u003cdiv\n    className={cn(\n      'grid grid-cols-1 items-center gap-10',\n      image?.src && 'md:grid-cols-2',\n      className,\n    )}\n  >\n    \u003cdiv className=\"flex flex-col gap-4\">\n      {title && (\n        \u003ch3 className=\"text-2xl font-semibold tracking-tight md:text-3xl\">\n          {title}\n        \u003c/h3>\n      )}\n      {body && (\n        \u003cFormattedText className=\"text-lg leading-relaxed opacity-80 [&_li]:mb-2 [&_p]:mb-4 [&_p:last-child]:mb-0 [&_ul]:list-disc [&_ul]:pl-5\">\n          {body}\n        \u003c/FormattedText>\n      )}\n      {content}\n      {actions && \u003cdiv className=\"mt-2 flex flex-wrap gap-4\">{actions}\u003c/div>}\n    \u003c/div>\n    {image?.src && (\n      \u003cimg\n        src={image.src}\n        alt={image.alt || ''}\n        width={image.width}\n        height={image.height}\n        className=\"w-full rounded-xl object-cover\"\n      />\n    )}\n  \u003c/div>\n);\n\nexport default TabPanel;\n",

        "jsx": "import { Children, useState } from 'react';\nimport { cn, FormattedText } from 'drupal-canvas';\n\nconst backgrounds = {\n  none: '',\n  white: 'bg-white text-gray-900',\n  light: 'bg-gray-50 text-gray-900',\n  dark: 'bg-gray-900 text-white',\n};\n\nconst Tabs = ({\n  title,\n  intro,\n  background = 'none',\n  align = 'center',\n  panels,\n  className,\n}) => {\n  const [active, setActive] = useState(0);\n  const items = Children.toArray(panels);\n\n  return (\n    \u003csection className={cn('w-full py-16', backgrounds[background], className)}>\n      \u003cdiv className=\"mx-auto max-w-7xl px-6\">\n        {(title || intro) && (\n          \u003cdiv\n            className={cn(\n              'mb-10 flex max-w-3xl flex-col gap-3',\n              align === 'center' && 'mx-auto text-center',\n            )}\n          >\n            {title && (\n              \u003ch2 className=\"text-3xl font-semibold tracking-tight md:text-4xl\">\n                {title}\n              \u003c/h2>\n            )}\n            {intro && (\n              \u003cFormattedText className=\"text-lg leading-relaxed opacity-80\">\n                {intro}\n              \u003c/FormattedText>\n            )}\n          \u003c/div>\n        )}\n\n        \u003cdiv\n          role=\"tablist\"\n          className={cn(\n            'mb-10 flex flex-wrap gap-2 border-b border-current/15',\n            align === 'center' ? 'justify-center' : 'justify-start',\n          )}\n        >\n          {items.map((panel, i) => (\n            \u003cbutton\n              key={i}\n              type=\"button\"\n              role=\"tab\"\n              aria-selected={active === i}\n              onClick={() => setActive(i)}\n              className={cn(\n                '-mb-px border-b-2 px-5 py-3 text-sm font-semibold transition-colors',\n                active === i\n                  ? 'border-primary-600 text-primary-700'\n                  : 'border-transparent opacity-60 hover:opacity-100',\n              )}\n            >\n              {panel?.props?.label || `Tab ${i + 1}`}\n            \u003c/button>\n          ))}\n        \u003c/div>\n\n        \u003cdiv role=\"tabpanel\">{items[active]}\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  );\n};\n\nexport default Tabs;\n",
        "yml": "name: Tabs\nmachineName: tabs\ndescription: >-\n  Tabbed band that shows one panel at a time. Fill the panels slot with Tab\n  Panel components - each panel's Label prop becomes its tab button. Use for\n  by-industry, by-role or by-product content that would otherwise make a page\n  very long.\nstatus: true\nrequired: []\nprops:\n  properties:\n    title:\n      title: Title\n      type: string\n      examples:\n        - Built for every team\n    intro:\n      title: Intro\n      type: string\n      contentMediaType: text/html\n      x-formatting-context: block\n      examples:\n        - \u003cp>Pick the view that matches how you work.\u003c/p>\n    background:\n      title: Background\n      type: string\n      enum:\n        - none\n        - white\n        - light\n        - dark\n      meta:enum:\n        none: None (inherit)\n        white: White\n        light: Light gray\n        dark: Dark\n      examples:\n        - none\n    align:\n      title: Align\n      type: string\n      enum:\n        - left\n        - center\n      meta:enum:\n        left: Left\n        center: Center\n      examples:\n        - center\nslots:\n  panels:\n    title: Panels\n",
        "mocks": "{\n  \"mocks\": [\n    {\n      \"name\": \"Three panels\",\n      \"props\": {\n        \"title\": \"Built for every team\",\n        \"intro\": \"\u003cp>Pick the view that matches how you work.\u003c/p>\",\n        \"align\": \"center\",\n        \"background\": \"light\"\n      },\n      \"slots\": { \"panels\": [\"t1\", \"t2\", \"t3\"] },\n      \"elements\": {\n        \"t1\": {\n          \"type\": \"tab-panel\",\n          \"props\": {\n            \"label\": \"Marketing\",\n            \"title\": \"Launch campaigns without a release\",\n            \"body\": \"\u003cp>Build and publish landing pages the same day.\u003c/p>\"\n          }\n        },\n        \"t2\": {\n          \"type\": \"tab-panel\",\n          \"props\": {\n            \"label\": \"Engineering\",\n            \"title\": \"Own the components, not the pages\",\n            \"body\": \"\u003cp>Ship a component once and let marketing compose with it.\u003c/p>\"\n          }\n        },\n        \"t3\": {\n          \"type\": \"tab-panel\",\n          \"props\": {\n            \"label\": \"Compliance\",\n            \"title\": \"Every change is reviewable\",\n            \"body\": \"\u003cp>Full audit history and one-click revert.\u003c/p>\"\n          }\n        }\n      }\n    }\n  ]\n}\n"

<script>
  (function () {
    var DATA = JSON.parse(
      document.getElementById('component-data').textContent,
    );
    var FAMILY_ORDER = ['Primitives', 'Chrome', 'Sections', 'Content'];
    var FLAG_LABEL = {
      slots: 'slots',
      image: 'image prop',
      richtext: 'rich text',
      state: 'interactive',
      data: 'fetches data',
    };

    var state = {
      q: '',
      fams: new Set(),
      flags: new Set(),
      id: null,
      tab: 'jsx',
    };

    /* ---------------- helpers ---------------- */
    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function el(id) {
      return document.getElementById(id);
    }

    /* ---------------- syntax highlighting ---------------- */
    var GRAMMAR = {
      jsx: [
        ['com', /\/\/[^\n]*/],
        ['str', /'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`/],
        [
          'kw',
          /\b(?:import|from|export|default|const|let|var|function|return|if|else|null|true|false|new|typeof|Boolean|Array|Number|String|Math|JSON|Intl)\b/,
        ],
        ['tag', /<\/?[A-Za-z][\w.]*|\/>/],
        ['num', /\b\d+(?:\.\d+)?\b/],
      ],
      yml: [
        ['com', /#[^\n]*/],
        ['key', /^\s*[\w$-]+(?=:)/],
        ['str', /'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"/],
        ['kw', /\b(?:true|false|null)\b/],
        ['num', /(?<=\s)\d+(?:\.\d+)?\b/],
      ],
      mocks: [
        ['key', /"(?:[^"\\]|\\.)*"(?=\s*:)/],
        ['str', /"(?:[^"\\]|\\.)*"/],
        ['kw', /\b(?:true|false|null)\b/],
        ['num', /-?\b\d+(?:\.\d+)?\b/],
      ],
    };
    var RX = {};
    Object.keys(GRAMMAR).forEach(function (k) {
      RX[k] = new RegExp(
        GRAMMAR[k]
          .map(function (r) {
            return '(?<' + r[0] + '>' + r[1].source + ')';
          })
          .join('|'),
        'g',
      );
    });

    // Highlight line by line: no token in this corpus spans a newline, so this is
    // safe and guarantees we never emit a span that straddles a line boundary.
    function highlight(code, lang) {
      var rx = RX[lang];
      return code
        .split('\n')
        .map(function (line, i) {
          var out = '',
            last = 0,
            m;
          rx.lastIndex = 0;
          while ((m = rx.exec(line)) !== null) {
            if (m[0] === '') {
              rx.lastIndex++;
              continue;
            }
            out += esc(line.slice(last, m.index));
            var cls = Object.keys(m.groups).find(function (g) {
              return m.groups[g] !== undefined;
            });
            out += '<span class="tk-' + cls + '">' + esc(m[0]) + '</span>';
            last = m.index + m[0].length;
          }
          out += esc(line.slice(last));
          return (
            '<span class="ln" data-n="' +
            (i + 1) +
            '">' +
            (out || '​') +
            '</span>'
          );
        })
        .join('');
    }

    /* ---------------- filtering ---------------- */
    function matches(c) {
      if (state.fams.size && !state.fams.has(c.family)) return false;
      for (var f of state.flags) if (!c.flags[f]) return false;
      if (!state.q) return true;
      var q = state.q.toLowerCase();
      if (c.id.indexOf(q) > -1) return true;
      if (c.name.toLowerCase().indexOf(q) > -1) return true;
      if (c.description.toLowerCase().indexOf(q) > -1) return true;
      if (
        c.props.some(function (p) {
          return p.name.toLowerCase().indexOf(q) > -1;
        })
      )
        return true;
      if (
        c.slots.some(function (s) {
          return s.toLowerCase().indexOf(q) > -1;
        })
      )
        return true;
      return false;
    }

    // Results in the order the rail renders them, so the boot selection and the
    // fallback after a filter change always agree with what the reader sees.
    function orderedHits() {
      var hits = DATA.filter(matches);
      return FAMILY_ORDER.reduce(function (acc, fam) {
        return acc.concat(
          hits.filter(function (c) {
            return c.family === fam;
          }),
        );
      }, []).concat(
        hits.filter(function (c) {
          return FAMILY_ORDER.indexOf(c.family) === -1;
        }),
      );
    }

    /* ---------------- rail ---------------- */
    function renderRail() {
      var hits = orderedHits();
      el('rail-count').textContent =
        hits.length + (hits.length === 1 ? ' result' : ' results');
      var active = state.fams.size || state.flags.size || state.q;
      el('rail-sub').textContent = active ? 'filtered' : 'all';
      el('reset').hidden = !active;

      if (!hits.length) {
        el('results').innerHTML =
          '<p class="empty">Nothing matches <b>' +
          esc(state.q || 'these filters') +
          '</b>. Try a shorter term, or clear the filters above.</p>';
        return;
      }

      var html = '';
      FAMILY_ORDER.forEach(function (fam) {
        var group = hits.filter(function (c) {
          return c.family === fam;
        });
        if (!group.length) return;
        html +=
          '<div class="group-label">' +
          esc(fam) +
          ' &middot; ' +
          group.length +
          '</div><ul>';
        group.forEach(function (c) {
          var dots = Object.keys(FLAG_LABEL)
            .filter(function (f) {
              return c.flags[f];
            })
            .map(function () {
              return '<i class="dot"></i>';
            })
            .join('');
          html +=
            '<li><button class="entry" data-id="' +
            esc(c.id) +
            '" aria-current="' +
            (c.id === state.id) +
            '">' +
            '<span class="en">' +
            esc(c.name) +
            '</span>' +
            '<span class="em"><span>' +
            esc(c.id) +
            '</span>' +
            '<span class="dotrow">' +
            dots +
            '</span></span></button></li>';
        });
        html += '</ul>';
      });
      el('results').innerHTML = html;

      if (
        !hits.some(function (c) {
          return c.id === state.id;
        })
      )
        select(hits[0].id, false);
    }

    /* ---------------- detail ---------------- */
    function renderDetail() {
      var c = DATA.find(function (x) {
        return x.id === state.id;
      });
      if (!c) {
        el('detail').innerHTML = '';
        return;
      }

      var facts = [
        ['Props', c.props.length],
        [
          'Required',
          c.props.filter(function (p) {
            return p.required;
          }).length,
        ],
        ['Slots', c.slots.length],
        ['Mocks', c.mocks.length],
        ['Lines', c.lines],
        ['On pages', c.usedOn.length],
      ]
        .map(function (f) {
          return (
            '<div class="fact"><dt>' +
            f[0] +
            '</dt><dd' +
            (f[1] === 0 ? ' class="none"' : '') +
            '>' +
            (f[1] === 0 ? '&mdash;' : f[1]) +
            '</dd></div>'
          );
        })
        .join('');

      var propRows = c.props.length
        ? c.props
            .map(function (p) {
              return (
                '<tr><td class="pname">' +
                esc(p.name) +
                '</td>' +
                '<td><span class="kind" data-k="' +
                esc(p.kind) +
                '">' +
                esc(p.kind) +
                '</span>' +
                (p.enum.length
                  ? '<div class="enums">' +
                    p.enum
                      .map(function (e) {
                        return '<span>' + esc(e) + '</span>';
                      })
                      .join('') +
                    '</div>'
                  : '') +
                '</td>' +
                '<td>' +
                (p.required ? '<span class="req">req</span>' : '') +
                '</td>' +
                '<td class="ex">' +
                esc(
                  p.example.length > 120
                    ? p.example.slice(0, 120) + '…'
                    : p.example,
                ) +
                '</td></tr>'
              );
            })
            .join('')
        : '';

      var tabs = [
        ['jsx', 'index.jsx'],
        ['yml', 'component.yml'],
        ['mocks', 'mocks.json'],
      ];

      el('detail').innerHTML =
        '<button class="back" id="back">&larr; All components</button>' +
        '<div class="dhead">' +
        '<div class="dtitle"><h2>' +
        esc(c.name) +
        '</h2>' +
        '<code class="machine">' +
        esc(c.id) +
        '</code>' +
        '<span class="fam">' +
        esc(c.family) +
        '</span></div>' +
        '<p class="desc">' +
        esc(c.description) +
        '</p>' +
        '</div>' +
        '<dl class="facts">' +
        facts +
        '</dl>' +
        (c.props.length
          ? '<section class="sect"><h3>Props<span class="hint">' +
            'set in the Canvas editor</span></h3><div class="tablewrap"><table>' +
            '<thead><tr><th>Name</th><th>Type</th><th></th><th>Example</th></tr></thead>' +
            '<tbody>' +
            propRows +
            '</tbody></table></div></section>'
          : '') +
        '<section class="sect"><h3>Slots<span class="hint">' +
        'where other components go</span></h3>' +
        (c.slots.length
          ? '<div class="pills">' +
            c.slots
              .map(function (s) {
                return '<span class="pill">' + esc(s) + '</span>';
              })
              .join('') +
            '</div>'
          : '<p class="noslots">No slots &mdash; this component takes props only.</p>') +
        '</section>' +
        '<section class="sect"><h3>Workbench mocks<span class="hint">preview states</span></h3>' +
        '<div class="pills">' +
        c.mocks
          .map(function (m) {
            return '<span class="pill plain">' + esc(m) + '</span>';
          })
          .join('') +
        '</div></section>' +
        (c.usedOn.length
          ? '<section class="sect"><h3>Used on</h3><div class="usedon">' +
            c.usedOn
              .map(function (u) {
                return '<a>' + esc(u) + '</a>';
              })
              .join('') +
            '</div></section>'
          : '') +
        '<section class="sect"><h3>Source</h3><div class="codebox">' +
        '<div class="codebar" role="tablist">' +
        tabs
          .map(function (t) {
            return (
              '<button class="ctab" role="tab" data-tab="' +
              t[0] +
              '" aria-selected="' +
              (state.tab === t[0]) +
              '">' +
              t[1] +
              '</button>'
            );
          })
          .join('') +
        '<button class="copy" id="copy">Copy</button>' +
        '</div>' +
        '<pre class="code" id="codeout"><code></code></pre>' +
        '</div></section>';

      paintCode();
      var back = el('back');
      if (back)
        back.addEventListener('click', function () {
          document.body.dataset.view = 'list';
        });
    }

    function paintCode() {
      var c = DATA.find(function (x) {
        return x.id === state.id;
      });
      var out = el('codeout');
      if (!c || !out) return;
      out.querySelector('code').innerHTML = highlight(
        c.src[state.tab],
        state.tab,
      );
      out.scrollTop = 0;
    }

    /* ---------------- selection ---------------- */
    function select(id, scroll) {
      state.id = id;
      if (location.hash.slice(1) !== id)
        history.replaceState(null, '', '#' + id);
      document.querySelectorAll('.entry').forEach(function (b) {
        b.setAttribute('aria-current', String(b.dataset.id === id));
      });
      renderDetail();
      if (scroll) {
        var cur = document.querySelector('.entry[aria-current="true"]');
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
      }
    }

    function toast(msg) {
      var t = el('toast');
      t.textContent = msg;
      t.classList.add('on');
      clearTimeout(t._h);
      t._h = setTimeout(function () {
        t.classList.remove('on');
      }, 1600);
    }

    /* ---------------- counts ---------------- */
    el('wm-count').textContent = DATA.length + ' components';
    FAMILY_ORDER.forEach(function (f) {
      document.querySelector('[data-c="' + f + '"]').textContent = DATA.filter(
        function (c) {
          return c.family === f;
        },
      ).length;
    });
    Object.keys(FLAG_LABEL).forEach(function (f) {
      document.querySelector('[data-f="' + f + '"]').textContent = DATA.filter(
        function (c) {
          return c.flags[f];
        },
      ).length;
    });

    /* ---------------- events ---------------- */
    el('q').addEventListener('input', function (e) {
      state.q = e.target.value.trim();
      el('searchwrap').classList.toggle('has-value', !!state.q);
      renderRail();
    });
    el('clearq').addEventListener('click', function () {
      el('q').value = '';
      state.q = '';
      el('searchwrap').classList.remove('has-value');
      renderRail();
      el('q').focus();
    });

    document.querySelectorAll('[data-fam]').forEach(function (b) {
      b.addEventListener('click', function () {
        var f = b.dataset.fam;
        state.fams.has(f) ? state.fams.delete(f) : state.fams.add(f);
        b.setAttribute('aria-pressed', String(state.fams.has(f)));
        renderRail();
      });
    });
    document.querySelectorAll('[data-flag]').forEach(function (b) {
      b.addEventListener('click', function () {
        var f = b.dataset.flag;
        state.flags.has(f) ? state.flags.delete(f) : state.flags.add(f);
        b.setAttribute('aria-pressed', String(state.flags.has(f)));
        renderRail();
      });
    });
    el('reset').addEventListener('click', function () {
      state.fams.clear();
      state.flags.clear();
      state.q = '';
      el('q').value = '';
      el('searchwrap').classList.remove('has-value');
      document.querySelectorAll('[data-fam],[data-flag]').forEach(function (b) {
        b.setAttribute('aria-pressed', 'false');
      });
      renderRail();
    });

    el('results').addEventListener('click', function (e) {
      var b = e.target.closest('.entry');
      if (!b) return;
      select(b.dataset.id, false);
      document.body.dataset.view = 'detail';
    });

    el('detail').addEventListener('click', function (e) {
      var tab = e.target.closest('.ctab');
      if (tab) {
        state.tab = tab.dataset.tab;
        document.querySelectorAll('.ctab').forEach(function (t) {
          t.setAttribute('aria-selected', String(t.dataset.tab === state.tab));
        });
        paintCode();
        return;
      }
      if (e.target.closest('#copy')) {
        var c = DATA.find(function (x) {
          return x.id === state.id;
        });
        var text = c.src[state.tab];
        var btn = e.target.closest('#copy');
        var done = function () {
          btn.textContent = 'Copied';
          btn.dataset.done = '1';
          setTimeout(function () {
            btn.textContent = 'Copy';
            btn.dataset.done = '';
          }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () {
            toast(
              'Copy blocked by the browser — select the code and copy manually.',
            );
          });
        } else {
          toast(
            'Copy blocked by the browser — select the code and copy manually.',
          );
        }
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement !== el('q')) {
        e.preventDefault();
        el('q').focus();
        el('q').select();
        return;
      }
      if (e.key === 'Escape' && document.activeElement === el('q')) {
        el('q').blur();
        return;
      }
      if (
        (e.key === 'ArrowDown' || e.key === 'ArrowUp') &&
        document.activeElement !== el('q')
      ) {
        var ids = [].map.call(
          document.querySelectorAll('.entry'),
          function (b) {
            return b.dataset.id;
          },
        );
        var i = ids.indexOf(state.id);
        if (i === -1) return;
        e.preventDefault();
        var next =
          ids[
            e.key === 'ArrowDown'
              ? Math.min(i + 1, ids.length - 1)
              : Math.max(i - 1, 0)
          ];
        if (next) select(next, true);
      }
    });

    var themeBtn = el('theme');
    themeBtn.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      var isDark = cur
        ? cur === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('ci-theme', next);
      } catch (err) {
        /* storage unavailable */
      }
    });
    try {
      var saved = localStorage.getItem('ci-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    } catch (err) {
      /* storage unavailable */
    }

    /* ---------------- boot ---------------- */
    var initial = decodeURIComponent(location.hash.slice(1));
    state.id = DATA.some(function (c) {
      return c.id === initial;
    })
      ? initial
      : orderedHits()[0].id;
    document.body.dataset.view = window.matchMedia('(max-width: 900px)').matches
      ? 'list'
      : 'detail';
    renderRail();
    renderDetail();
  })();
</script>
