name: Feature Split
machineName: feature-split
description: >-
  Copy on one side, image or embedded video on the other. Stack several of these
  and flip Media Position between instances to build the classic alternating
  feature story - that is why there is no separate alternating-features
  component in this library.
status: true
required:
  - title
props:
  properties:
    eyebrow:
      title: Eyebrow
      type: string
      examples:
        - Content operations
    title:
      title: Title
      type: string
      examples:
        - Publish without waiting on a release
    body:
      title: Body
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - >-
          <p>Explain the capability in two or three sentences, or use a short
          bulleted list.</p>
    image:
      title: Image
      type: object
      examples:
        - src: https://placehold.co/1200x900@2x.png
          alt: ''
          width: 1200
          height: 900
      $ref: json-schema-definitions://canvas.module/image
    videoUrl:
      title: Video Url
      type: string
      format: uri-reference
      examples:
        - https://www.youtube.com/embed/aqz-KE-bpKQ
    mediaPosition:
      title: Media Position
      type: string
      enum:
        - start
        - end
      meta:enum:
        start: Media first
        end: Media last
      examples:
        - end
    background:
      title: Background
      type: string
      enum:
        - none
        - white
        - light
        - dark
        - primary
      meta:enum:
        none: None (inherit)
        white: White
        light: Light gray
        dark: Dark
        primary: Primary
      examples:
        - none
slots:
  actions:
    title: Actions
