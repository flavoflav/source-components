name: Grid Container
machineName: grid-container
description: >-
  Responsive column grid that accepts any child components in its items slot.
  This is the generic layout primitive behind every card grid, logo wall and
  feature grid - reach for it whenever a design repeats blocks across columns
  and no purpose-built grid component already exists.
status: true
required: []
props:
  properties:
    columnCount:
      title: Column Count
      type: integer
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      meta:enum:
        1: One
        2: Two
        3: Three
        4: Four
        5: Five
        6: Six
      examples:
        - 3
    gap:
      title: Gap
      type: string
      enum:
        - none
        - small
        - medium
        - large
      meta:enum:
        none: None
        small: Small
        medium: Medium
        large: Large
      examples:
        - medium
slots:
  items:
    title: Items
