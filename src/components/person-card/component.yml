name: Person Card
machineName: person-card
description: >-
  One person - photo, name, role, short bio and contact links. Use inside a Card
  Grid for leadership, team, speaker, author or advisory board pages.
status: true
required:
  - name
props:
  properties:
    name:
      title: Name
      type: string
      examples:
        - Priya Raman
    role:
      title: Role
      type: string
      examples:
        - Chief Technology Officer
    photo:
      title: Photo
      type: object
      examples:
        - src: https://placehold.co/600x750@2x.png
          alt: ''
          width: 600
          height: 750
      $ref: json-schema-definitions://canvas.module/image
    bio:
      title: Bio
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - <p>Two sentences on background and what they work on.</p>
    email:
      title: Email
      type: string
      examples:
        - priya@example.com
    linkedinUrl:
      title: Linkedin Url
      type: string
      format: uri-reference
      examples:
        - https://linkedin.com/in/example
    url:
      title: Url
      type: string
      format: uri-reference
      examples:
        - /about/team/priya-raman
    align:
      title: Align
      type: string
      enum:
        - left
        - center
      meta:enum:
        left: Left
        center: Center
      examples:
        - left
    photoShape:
      title: Photo Shape
      type: string
      enum:
        - rounded
        - circle
      meta:enum:
        rounded: Rounded rectangle
        circle: Circle
      examples:
        - rounded
slots: []
