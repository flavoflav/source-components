name: Theme Switch
machineName: theme-switch
description: >-
  Toggles the site between the dark and light palettes by setting data-theme on
  the document root, which the ramps in global.css respond to - no component
  needs a dark variant of its own. The choice is remembered in the browser. Put
  one in the actions slot of Site Header. Because components hydrate on the
  client, a stored choice that differs from the CSS default flashes briefly on
  first paint, so leave Default Theme matching the site's default palette.
status: true
required: []
props:
  properties:
    variant:
      title: Variant
      type: string
      enum:
        - icon
        - icon_label
        - segmented
      meta:enum:
        icon: Icon only
        icon_label: Icon and label
        segmented: Segmented light/dark
      examples:
        - icon
    defaultTheme:
      title: Default Theme
      type: string
      enum:
        - dark
        - light
        - system
      meta:enum:
        dark: Dark
        light: Light
        system: Follow the operating system
      examples:
        - dark
    lightLabel:
      title: Light Label
      type: string
      examples:
        - Light
    darkLabel:
      title: Dark Label
      type: string
      examples:
        - Dark
slots: []
